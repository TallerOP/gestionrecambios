<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; }

.header {
  position:sticky;
  top:0;
  background:white;
  padding:10px;
  text-align:center;
  z-index:1000;
}

input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  box-sizing:border-box;
}

.filtros {
  display:flex;
  gap:5px;
}

.filtros button {
  flex:1;
  padding:10px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:8px;
  text-align:center;
}

td.nombre { text-align:left; }

tr { border-bottom:1px solid #ccc; }

.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; }

thead th {
  position:sticky;
  top:160px;
  background:#eee;
}

</style>
</head>

<body>

<div class="header">
  <h3>Almacén</h3>
</div>

<div style="padding:10px;">

<button onclick="volver()">⬅ Volver</button>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<select id="filtroAlmacen" onchange="filtrar()"></select>

<div class="filtros">
  <button onclick="setEstado('todos')">Todos</button>
  <button onclick="setEstado('bajo')">Bajo</button>
  <button onclick="setEstado('alto')">Alto</button>
  <button onclick="setEstado('critico')">Críticos</button>
</div>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nombre</th>
<th>Almacén</th>
<th>Stock</th>
<th>Mín</th>
<th>Máx</th>
<th>Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=50";

let DATA=[];
let FILTRADOS=[];
let filtroEstado="todos";

// SESIÓN
if (!localStorage.getItem("sesion")) location="index.html";

// INIT
window.onload = async ()=>{

  let cache = localStorage.getItem("recambios_cache");

  if (cache) {
    DATA = JSON.parse(cache);
    cargarAlmacenes();
    filtrar();
  }

  const res = await fetch(API_URL);
  const json = await res.json();

  DATA = json.recambios.filter(r => r.activo==="SI");

  localStorage.setItem("recambios_cache", JSON.stringify(DATA));

  cargarAlmacenes();
  filtrar();
};

// ALMACENES
function cargarAlmacenes(){
  let lista=[...new Set(DATA.map(r=>r.almacen))];
  filtroAlmacen.innerHTML='<option value="">Todos</option>'+
    lista.map(a=>`<option>${a}</option>`).join('');
}

// FILTROS
function setEstado(e){ filtroEstado=e; filtrar(); }

function filtrar(){

  let v=buscador.value.toLowerCase();
  let alm=filtroAlmacen.value;

  FILTRADOS=DATA.filter(r=>{

    let stock=Number(r.stock);
    let min=Number(r.min);
    let max=Number(r.max);

    let ok=true;

    if (filtroEstado==="bajo") ok=stock<min;
    if (filtroEstado==="alto") ok=stock>max;
    if (filtroEstado==="critico") ok=r.critico==="SI";

    return ok &&
      (!alm || r.almacen===alm) &&
      (r.codigo.toLowerCase().includes(v) || r.nombre.toLowerCase().includes(v));
  });

  render();
}

// RENDER RÁPIDO
function render(){

  tabla.innerHTML="";
  let i=0;

  function chunk(){

    let html="";

    for(let j=0;j<50 && i<FILTRADOS.length;j++,i++){

      let r=FILTRADOS[i];

      let clase="";
      if(r.stock<r.min) clase="bajo";
      else if(r.stock>r.max) clase="alto";
      else if(r.critico==="SI") clase="critico";

      html+=`
      <tr class="${clase}">
        <td>${r.codigo}</td>
        <td class="nombre">${r.nombre}</td>
        <td>${r.almacen}</td>
        <td>${r.stock}</td>
        <td>${r.min}</td>
        <td>${r.max}</td>
        <td>${r.critico}</td>
      </tr>`;
    }

    tabla.insertAdjacentHTML("beforeend",html);

    if(i<FILTRADOS.length) requestAnimationFrame(chunk);
  }

  chunk();
}

// NAV
function volver(){ location="index.html"; }

</script>

</body>
</html>
