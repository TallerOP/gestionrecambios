<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 1000;

  display: flex;
  flex-direction: column;
  align-items: center;

  background: rgba(255,255,255,0.95);
  padding: 12px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* CONTENEDOR */
.container { padding:15px; }

/* BOTONES */
button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn { background:#ddd; }

/* BUSCADOR */
#buscador {
  width:100%;
  padding:10px;
  margin:10px 0;
}

/* TABLA */
.table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

.table th, .table td {
  padding:8px;
  border-right:1px solid rgba(0,0,0,0.05);
  text-align:center;
}

.table td.nombre {
  text-align:left;
}

/* FILAS */
.table tr {
  border-bottom:1px solid rgba(0,0,0,0.3);
}

/* HEADER FIJO */
.table thead th {
  position: sticky;
  top: 80px;
  background:#f5f5f5;
  z-index:500;
}

/* ALERTAS */
.bajo { background:#ffb3b3; }
.alto { background:#ffd699; }
.critico { background:#fff3b0; font-weight:bold; }
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<button onclick="volver()" class="btn">⬅ Volver</button>
<button onclick="irHistorico()" class="btn">📊 Histórico</button>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<table class="table">
<thead>
<tr>
<th>Código</th>
<th>Nombre</th>
<th>Ubicación</th>
<th>Stock</th>
<th>Mín</th>
<th>Máx</th>
<th>Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=12";

// 🔐 SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) window.location.href="index.html";

// 🔁 refresca sesión
sesion.timestamp = Date.now();
localStorage.setItem("sesion", JSON.stringify(sesion));

let DATA = [];
let FILTRADOS = [];

window.onload = async () => {
  const res = await fetch(API_URL);
  const json = await res.json();
  DATA = json.recambios;
  FILTRADOS = DATA;
  render();
};

// RENDER
function render() {
  tabla.innerHTML = FILTRADOS.map(r => {

    let clase = "";

    if (Number(r.stock) < Number(r.min)) clase = "bajo";
    else if (Number(r.stock) > Number(r.max)) clase = "alto";
    else if ((r.critico || "").toUpperCase() === "SI") clase = "critico";

    return `
      <tr class="${clase}">
        <td>${r.codigo}</td>
        <td class="nombre">${r.nombre}</td>
        <td>${r.ubicacion || ''}</td>
        <td>${r.stock}</td>
        <td>${r.min}</td>
        <td>${r.max}</td>
        <td>${r.critico || ''}</td>
      </tr>
    `;
  }).join("");
}

// FILTRO
function filtrar() {
  const v = buscador.value.toLowerCase();

  FILTRADOS = DATA.filter(r =>
    r.codigo.toLowerCase().includes(v) ||
    r.nombre.toLowerCase().includes(v)
  );

  render();
}

// NAV
function volver(){ window.location.href="index.html"; }
function irHistorico(){ window.location.href="historico.html"; }
</script>

</body>
</html>
