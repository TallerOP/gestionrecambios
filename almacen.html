<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

.container { padding:10px; }

input, button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}

input { border:1px solid #ccc; }

button {
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.2);
}

button:hover { filter:brightness(1.1); }
button:active { transform:translateY(2px); }

/* NAV */
.nav { display:flex; gap:6px; }
.nav button { flex:1; }

/* TABLA */
table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th, td {
  padding:8px;
  text-align:center;
}

td.nombre { text-align:left; }

tr { border-bottom:1px solid rgba(0,0,0,0.2); }

.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; font-weight:bold; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<input id="buscar" placeholder="Buscar recambio...">

<div class="nav">
  <button onclick="location='index.html'">Inicio</button>
  <button onclick="location='historico.html'">Histórico</button>
</div>

<table>
<thead>
<tr>
<th>Código</th><th>Nombre</th><th>Ubicación</th>
<th>Stock</th><th>Min</th><th>Max</th><th>Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=200";

let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) location="login.html";

let DATA={};

window.onload=async()=>{
  const res=await fetch(API_URL);
  DATA=await res.json();
  render();
};

function render(){
  let f=buscar.value.toLowerCase();

  let rows=DATA.recambios
  .filter(r=>r.activo==="SI")
  .filter(r=>r.nombre.toLowerCase().includes(f) || r.codigo.includes(f))
  .map(r=>{
    let clase="";
    if(r.stock<r.min) clase="bajo";
    else if(r.stock>r.max) clase="alto";
    else if(r.critico==="SI") clase="critico";

    return `<tr class="${clase}">
      <td>${r.codigo}</td>
      <td class="nombre">${r.nombre}</td>
      <td>${r["Ubicación"]||""}</td>
      <td>${r.stock}</td>
      <td>${r.min}</td>
      <td>${r.max}</td>
      <td>${r.critico}</td>
    </tr>`;
  }).join("");

  tabla.innerHTML=rows;
}

buscar.oninput=render;
</script>

</body>
</html>
