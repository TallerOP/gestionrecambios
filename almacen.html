<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

.container { padding:10px; }

input, button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
}

button {
  background:#0E3471;
  color:white;
  cursor:pointer;
}

table { width:100%; border-collapse:collapse; }
th, td { padding:8px; text-align:center; }
td.nombre { text-align:left; }

.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; }
</style>
</head>

<body>

<div class="header">
  <h3>Gestión de recambios</h3>
</div>

<div class="container">

<input id="buscar" placeholder="Buscar...">

<table>
<thead>
<tr>
<th>Código</th><th>Nombre</th><th>Stock</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL="TU_URL";

// 🔐 SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) location="login.html";

let RECAMBIOS = [];

window.onload = async ()=>{

  const res = await fetch(API_URL);
  const json = await res.json();

  console.log("JSON COMPLETO:", json);

  // 🔥 DETECCIÓN AUTOMÁTICA
  if (json.recambios) RECAMBIOS = json.recambios;
  else if (json.data) RECAMBIOS = json.data;
  else if (Array.isArray(json)) RECAMBIOS = json;
  else {
    alert("Formato de datos desconocido");
    return;
  }

  console.log("RECAMBIOS:", RECAMBIOS);

  render();
};

function render(){

  if (!RECAMBIOS.length){
    tabla.innerHTML = "<tr><td colspan='3'>NO HAY DATOS</td></tr>";
    return;
  }

  let f = buscar.value.toLowerCase();

  tabla.innerHTML = RECAMBIOS

  .filter(r => (r.nombre || "").toLowerCase().includes(f))

  .map(r => `
    <tr>
      <td>${r.codigo}</td>
      <td class="nombre">${r.nombre}</td>
      <td>${r.stock}</td>
    </tr>
  `).join("");
}

buscar.oninput = render;
</script>

</body>
</html>
