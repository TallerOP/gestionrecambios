<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: rgba(255,255,255,0.95);
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.header h3 {
  margin:5px 0 0 0;
  font-size:18px;
}

/* CONTENEDOR */
.container {
  padding:10px;
}

/* INPUTS */
input, select {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
  font-size:14px;
}

/* BOTONES */
button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#0E3471;
  color:white;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.2);
  transition:0.2s;
}

button:hover {
  filter:brightness(1.1);
}

button:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 rgba(0,0,0,0.2);
}

/* BOTONES SUPERIORES */
.nav {
  display:flex;
  gap:6px;
}

.nav button {
  flex:1;
}

/* FILTROS */
.filtros {
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.filtros button {
  flex:1;
  font-size:12px;
  padding:10px;
}

/* TABLA */
.table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.table th, .table td {
  padding:10px;
  text-align:center;
}

.table td.nombre {
  text-align:left;
}

.table tr {
  border-bottom:1px solid rgba(0,0,0,0.2);
}

/* CABECERA FIJA */
.table thead th {
  position: sticky;
  top: 190px;
  background:#f5f5f5;
  z-index:500;
  cursor:pointer;
}

/* COLORES */
.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; font-weight:bold; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<div class="nav">
  <button onclick="volver()">⬅ Inicio</button>
  <button onclick="irHistorico()">📊 Histórico</button>
</div>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<select id="filtroAlmacen" onchange="filtrar()">
  <option value="">Todos los almacenes</option>
</select>

<div class="filtros">
  <button onclick="setEstado('todos')">Todos</button>
  <button onclick="setEstado('bajo')">Bajo stock</button>
  <button onclick="setEstado('alto')">Alto stock</button>
  <button onclick="setEstado('critico')">Críticos</button>
</div>

<table class="table">
<thead>
<tr>
<th onclick="ordenar('codigo')">Código</th>
<th onclick="ordenar('nombre')">Nombre</th>
<th onclick="ordenar('almacen')">Almacén</th>
<th onclick="ordenar('ubicacion')">Ubicación</th>
<th onclick="ordenar('stock')">Stock</th>
<th onclick="ordenar('min')">Mín</th>
<th onclick="ordenar('max')">Máx</th>
<th onclick="ordenar('critico')">Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=40";

// SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) window.location.href="index.html";

let DATA = [];
let FILTRADOS = [];
let filtroEstado = "todos";
let ordenActual = "";
let asc = true;

window.onload = async () => {
  const res = await fetch(API_URL);
  const json = await res.json();

  DATA = (json.recambios || []).filter(r =>
    String(r.activo).toUpperCase() === "SI"
  );

  cargarAlmacenes();
  filtrar();
};

// CARGAR ALMACENES
function cargarAlmacenes() {
  let lista = [...new Set(DATA.map(r => r.almacen).filter(a=>a))];

  filtroAlmacen.innerHTML = `
    <option value="">Todos los almacenes</option>
    ${lista.map(a=>`<option value="${a}">${a}</option>`).join("")}
  `;
}

// FILTROS
function setEstado(e){
  filtroEstado = e;
  filtrar();
}

function filtrar() {
  let v = buscador.value.toLowerCase();
  let almacenSel = filtroAlmacen.value;

  FILTRADOS = DATA.filter(r => {

    let stock = Number(r.stock)||0;
    let min = Number(r.min)||0;
    let max = Number(r.max)||0;

    let matchBusqueda =
      String(r.codigo).toLowerCase().includes(v) ||
      String(r.nombre).toLowerCase().includes(v);

    let matchAlmacen =
      !almacenSel || r.almacen == almacenSel;

    let matchEstado = true;

    if (filtroEstado === "bajo")
      matchEstado = stock < min;

    if (filtroEstado === "alto")
      matchEstado = stock > max;

    if (filtroEstado === "critico")
      matchEstado = String(r.critico).toUpperCase() === "SI";

    return matchBusqueda && matchAlmacen && matchEstado;
  });

  render();
}

// ORDEN
function ordenar(campo){
  asc = (ordenActual === campo) ? !asc : true;
  ordenActual = campo;

  FILTRADOS.sort((a,b)=>{
    let v1 = a[campo] || "";
    let v2 = b[campo] || "";

    v1 = isNaN(v1) ? v1.toLowerCase() : Number(v1);
    v2 = isNaN(v2) ? v2.toLowerCase() : Number(v2);

    return (v1 > v2 ? 1 : -1) * (asc ? 1 : -1);
  });

  render();
}

// RENDER
function render(){
  tabla.innerHTML = FILTRADOS.map(r=>{

    let stock = Number(r.stock)||0;
    let min = Number(r.min)||0;
    let max = Number(r.max)||0;

    let ubicacion = r["Ubicación"] || r.ubicacion || "";

    let clase="";
    if(stock < min) clase="bajo";
    else if(stock > max) clase="alto";
    else if(String(r.critico).toUpperCase()==="SI") clase="critico";

    return `
    <tr class="${clase}">
      <td>${r.codigo}</td>
      <td class="nombre">${r.nombre}</td>
      <td>${r.almacen||""}</td>
      <td>${ubicacion}</td>
      <td>${stock}</td>
      <td>${min}</td>
      <td>${max}</td>
      <td>${r.critico}</td>
    </tr>`;
  }).join("");
}

// NAV
function volver(){ window.location.href="index.html"; }
function irHistorico(){ window.location.href="historico.html"; }

</script>

</body>
</html>
