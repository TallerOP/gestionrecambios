<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: rgba(255,255,255,0.95);
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* CONTENEDOR */
.container { padding:15px; }

/* BOTONES */
button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn { background:#ddd; }

/* BUSCADOR */
#buscador {
  width:100%;
  padding:10px;
  margin:10px 0;
}

/* FILTROS */
.filtros {
  display:flex;
  gap:5px;
  margin:10px 0;
}
.filtros button {
  flex:1;
  font-size:12px;
}

/* TABLA */
.table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

.table th, .table td {
  padding:8px;
  border-right:1px solid rgba(0,0,0,0.05);
  text-align:center;
}

.table td.nombre {
  text-align:left;
}

/* FILAS */
.table tr {
  border-bottom:1px solid rgba(0,0,0,0.3);
}

/* HEADER FIJO */
.table thead th {
  position: sticky;
  top: 90px;
  background:#f5f5f5;
  z-index:500;
  cursor:pointer;
}

/* COLORES */
.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; font-weight:bold; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<button onclick="volver()" class="btn">⬅ Volver</button>
<button onclick="irHistorico()" class="btn">📊 Histórico</button>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<div class="filtros">
  <button onclick="setFiltro('todos')">Todos</button>
  <button onclick="setFiltro('criticos')">Críticos</button>
  <button onclick="setFiltro('bajo')">Bajo</button>
  <button onclick="setFiltro('alto')">Alto</button>
</div>

<table class="table">
<thead>
<tr>
<th onclick="ordenar('codigo')">Código</th>
<th onclick="ordenar('nombre')">Nombre</th>
<th onclick="ordenar('ubicacion')">Ubicación</th>
<th onclick="ordenar('stock')">Stock</th>
<th onclick="ordenar('min')">Mín</th>
<th onclick="ordenar('max')">Máx</th>
<th onclick="ordenar('critico')">Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=15";

// SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) window.location.href="index.html";

sesion.timestamp = Date.now();
localStorage.setItem("sesion", JSON.stringify(sesion));

let DATA = [];
let FILTRADOS = [];
let filtroActual = "todos";
let ordenActual = "";
let asc = true;

window.onload = async () => {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    DATA = json.recambios || [];
    aplicarFiltros();

  } catch (e) {
    alert("Error cargando datos");
    console.error(e);
  }
};

// FILTROS
function setFiltro(f) {
  filtroActual = f;
  aplicarFiltros();
}

function filtrar() {
  aplicarFiltros();
}

function aplicarFiltros() {
  let v = (buscador.value || "").toLowerCase();

  FILTRADOS = DATA.filter(r => {

    const codigo = String(r.codigo || "").toLowerCase();
    const nombre = String(r.nombre || "").toLowerCase();

    const matchBusqueda = codigo.includes(v) || nombre.includes(v);

    let matchFiltro = true;

    if (filtroActual === "criticos")
      matchFiltro = String(r.critico || "").toUpperCase() === "SI";

    if (filtroActual === "bajo")
      matchFiltro = Number(r.stock) < Number(r.min);

    if (filtroActual === "alto")
      matchFiltro = Number(r.stock) > Number(r.max);

    return matchBusqueda && matchFiltro;
  });

  render();
}

// ORDENAR
function ordenar(campo) {

  asc = (ordenActual === campo) ? !asc : true;
  ordenActual = campo;

  FILTRADOS.sort((a,b)=>{

    let v1 = a[campo];
    let v2 = b[campo];

    // Ubicación con tilde
    if (campo === "ubicacion") {
      v1 = a["Ubicación"] || a.ubicacion || "";
      v2 = b["Ubicación"] || b.ubicacion || "";
    }

    v1 = isNaN(v1) ? String(v1).toLowerCase() : Number(v1);
    v2 = isNaN(v2) ? String(v2).toLowerCase() : Number(v2);

    if (v1 > v2) return asc ? 1 : -1;
    if (v1 < v2) return asc ? -1 : 1;
    return 0;
  });

  render();
}

// RENDER
function render() {

  tabla.innerHTML = FILTRADOS.map(r => {

    const stock = Number(r.stock) || 0;
    const min = Number(r.min) || 0;
    const max = Number(r.max) || 0;

    const ubicacion = r["Ubicación"] || r.ubicacion || "";

    let clase = "";

    if (stock < min) clase = "bajo";
    else if (stock > max) clase = "alto";
    else if (String(r.critico || "").toUpperCase() === "SI") clase = "critico";

    return `
      <tr class="${clase}">
        <td>${r.codigo || ""}</td>
        <td class="nombre">${r.nombre || ""}</td>
        <td>${ubicacion}</td>
        <td>${stock}</td>
        <td>${min}</td>
        <td>${max}</td>
        <td>${r.critico || ""}</td>
      </tr>
    `;
  }).join("");
}

// NAV
function volver(){ window.location.href="index.html"; }
function irHistorico(){ window.location.href="historico.html"; }
</script>

</body>
</html>
