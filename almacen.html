<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }
body::before {
  content:""; position:fixed; width:100%; height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%; opacity:0.5; z-index:-1;
}

.header {
  position:sticky; top:0; z-index:1000;
  text-align:center; padding:12px;
  background:rgba(255,255,255,0.95);
}

.container { padding:10px; }

input, select {
  width:100%; padding:10px; margin:5px 0;
  border-radius:10px; border:1px solid #ccc;
}

button {
  padding:10px; border:none; border-radius:10px;
  cursor:pointer; background:#0E3471; color:white;
}

button:hover { opacity:0.9; }

.filtros { display:flex; gap:5px; margin:10px 0; }
.filtros button { flex:1; }

table {
  width:100%; border-collapse:collapse;
}

th, td {
  padding:8px; text-align:center;
}

thead th {
  position:sticky; top:160px;
  background:#f5f5f5; cursor:pointer;
}

.nombre { text-align:left; }

.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }
.critico { background:#fff3b0; }
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Almacén</h3>
</div>

<div class="container">

<button onclick="volver()">⬅ Volver</button>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<select id="filtroAlmacen" onchange="filtrar()"></select>

<div class="filtros">
  <button onclick="setEstado('todos')">Todos</button>
  <button onclick="setEstado('bajo')">Bajo</button>
  <button onclick="setEstado('alto')">Alto</button>
  <button onclick="setEstado('critico')">Crítico</button>
</div>

<table>
<thead>
<tr>
<th onclick="ordenar('codigo')">Código</th>
<th onclick="ordenar('nombre')">Nombre</th>
<th onclick="ordenar('almacen')">Almacén</th>
<th onclick="ordenar('ubicacion')">Ubicación</th>
<th onclick="ordenar('stock')">Stock</th>
<th onclick="ordenar('min')">Min</th>
<th onclick="ordenar('max')">Max</th>
<th onclick="ordenar('critico')">Crítico</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL = "TU_URL";

// CACHE
const CACHE_KEY = "data_cache";
const CACHE_TIME = 60000;

async function getData() {
  let cache = JSON.parse(localStorage.getItem(CACHE_KEY));
  let now = Date.now();

  if (cache && (now - cache.timestamp < CACHE_TIME)) return cache.data;

  let res = await fetch(API_URL);
  let data = await res.json();

  localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp:now,data}));
  return data;
}

let DATA = [];
let FILTRADOS = [];
let estado="todos";
let ordenCampo="";
let asc=true;

document.addEventListener("DOMContentLoaded", async ()=>{
  let json = await getData();

  DATA = (json.recambios||[]).filter(r=>String(r.activo).toUpperCase()==="SI");

  cargarAlmacenes();
  filtrar();
});

function cargarAlmacenes(){
  let lista=[...new Set(DATA.map(r=>r.almacen).filter(a=>a))];
  filtroAlmacen.innerHTML = `<option value="">Todos</option>` +
    lista.map(a=>`<option>${a}</option>`).join("");
}

function setEstado(e){ estado=e; filtrar(); }

function filtrar(){
  let v=buscador.value.toLowerCase();
  let alm=filtroAlmacen.value;

  FILTRADOS = DATA.filter(r=>{
    let stock=+r.stock||0, min=+r.min||0, max=+r.max||0;

    let ok =
      (r.codigo+"").includes(v) ||
      (r.nombre+"").toLowerCase().includes(v);

    if(alm && r.almacen!==alm) return false;

    if(estado==="bajo") ok &= stock<min;
    if(estado==="alto") ok &= stock>max;
    if(estado==="critico") ok &= String(r.critico).toUpperCase()==="SI";

    return ok;
  });

  render();
}

function ordenar(c){
  asc = ordenCampo===c ? !asc : true;
  ordenCampo=c;

  FILTRADOS.sort((a,b)=>{
    let v1=a[c]||"", v2=b[c]||"";
    v1=isNaN(v1)?v1.toLowerCase():+v1;
    v2=isNaN(v2)?v2.toLowerCase():+v2;
    return (v1>v2?1:-1)*(asc?1:-1);
  });

  render();
}

function render(){
  tabla.innerHTML = FILTRADOS.map(r=>{
    let stock=+r.stock||0, min=+r.min||0, max=+r.max||0;
    let clase = stock<min?"bajo":stock>max?"alto":
      (String(r.critico).toUpperCase()==="SI"?"critico":"");

    return `<tr class="${clase}">
      <td>${r.codigo}</td>
      <td class="nombre">${r.nombre}</td>
      <td>${r.almacen||""}</td>
      <td>${r["Ubicación"]||""}</td>
      <td>${stock}</td>
      <td>${min}</td>
      <td>${max}</td>
      <td>${r.critico}</td>
    </tr>`;
  }).join("");
}

function volver(){ location.href="index.html"; }
</script>

</body>
</html>
