<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carros</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.5;
  z-index:-1;
}

.header {
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container { padding:15px; }

/* BOTONES UNIFICADOS */
button {
  padding:14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#0E3471;
  color:white;
  font-size:15px;
  box-shadow:0 3px 6px rgba(0,0,0,0.2);
}

button:hover {
  opacity:0.9;
}

/* FILAS DE BOTONES (igual que consumibles) */
.row {
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  gap:6px;
}

.row button {
  flex:1;
}

/* BLOQUES */
.bloque {
  display:none;
  margin-top:10px;
}

.bloque.active {
  display:block;
}

/* TABLA */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:14px;
}

td, th {
  padding:8px;
  border-bottom:1px solid #ccc;
  text-align:center;
}

.nombre { text-align:left; }

.bajo { background:#ffb3b3; }
.alto { background:#0E3471; color:white; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Carros</h2>
</div>

<div class="container">

<button onclick="volver()">⬅ Volver</button>

<div class="row">
  <button onclick="toggle('bajo')">Bajo mínimo</button>
  <button onclick="toggle('alto')">Sobre máximo</button>
</div>

<div id="bajo" class="bloque"></div>
<div id="alto" class="bloque"></div>

<h3>Consumo</h3>

<div class="row">
  <button onclick="setTiempo('hoy')">Hoy</button>
  <button onclick="setTiempo('semana')">7 días</button>
  <button onclick="setTiempo('mes')">30 días</button>
  <button onclick="setTiempo('siempre')">Siempre</button>
</div>

<div id="consumo"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let RECAMBIOS = [];
let MOVS = [];
let tiempo = "siempre";

// LOAD
window.onload = async ()=>{
  let res = await fetch(API_URL);
  let json = await res.json();

  RECAMBIOS = (json.recambios || []).filter(r =>
    String(r.almacen).toUpperCase() === "CARROS"
  );

  MOVS = json.movimientos || [];

  renderBajo();
  renderAlto();
  renderConsumo();
};

// TOGGLE
function toggle(id){
  document.getElementById(id).classList.toggle("active");
}

// BAJO
function renderBajo(){
  let lista = RECAMBIOS.filter(r => Number(r.stock) < Number(r.min));
  document.getElementById("bajo").innerHTML = tabla(lista, "bajo");
}

// ALTO
function renderAlto(){
  let lista = RECAMBIOS.filter(r => Number(r.stock) > Number(r.max));
  document.getElementById("alto").innerHTML = tabla(lista, "alto");
}

// TABLA
function tabla(lista, clase){

  if(lista.length === 0) return "<p>Sin datos</p>";

  return `
  <table>
    <tr>
      <th>Código</th>
      <th class="nombre">Nombre</th>
      <th>Stock</th>
    </tr>
    ${lista.map(r=>`
      <tr class="${clase}">
        <td>${r.codigo}</td>
        <td class="nombre">${r.nombre}</td>
        <td>${r.stock}</td>
      </tr>
    `).join("")}
  </table>`;
}

// TIEMPO
function setTiempo(t){
  tiempo = t;
  renderConsumo();
}

// CONSUMO
function renderConsumo(){

  let ahora = new Date();

  let filtrados = MOVS.filter(m => {

    let fecha = new Date(m.fecha);

    if(tiempo === "hoy")
      return fecha.toDateString() === ahora.toDateString();

    if(tiempo === "semana")
      return (ahora - fecha) < 7*24*60*60*1000;

    if(tiempo === "mes")
      return (ahora - fecha) < 30*24*60*60*1000;

    return true;
  });

  filtrados = filtrados.filter(m => {
    let r = RECAMBIOS.find(x => x.codigo == m.codigo);
    return r;
  });

  let resumen = {};

  filtrados.forEach(m=>{
    let r = RECAMBIOS.find(x => x.codigo == m.codigo);
    if(!r) return;

    if(!resumen[r.nombre]) resumen[r.nombre] = 0;
    resumen[r.nombre] += Number(m.cantidad)||0;
  });

  document.getElementById("consumo").innerHTML = `
    <table>
      <tr><th class="nombre">Recambio</th><th>Cantidad</th></tr>
      ${Object.entries(resumen).map(([n,c])=>`
        <tr>
          <td class="nombre">${n}</td>
          <td>${c}</td>
        </tr>
      `).join("")}
    </table>
  `;
}

// NAV
function volver(){
  window.location.href="direccion.html";
}
</script>

</body>
</html>
