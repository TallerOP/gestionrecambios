<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: rgba(255,255,255,0.95);
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* CONTENIDO */
.container { padding:10px; }

/* KPIs */
.kpis {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.card {
  padding:15px;
  border-radius:10px;
  background:#f5f5f5;
  text-align:center;
}

.card h2 { margin:0; font-size:22px; }

.rojo { background:#ffb3b3; }
.azul { background:#0E3471; color:white; }
.amarillo { background:#fff3b0; }

/* BOTONES */
.nav {
  display:flex;
  gap:5px;
  margin-top:10px;
}

.nav button {
  flex:1;
  padding:12px;
  border:none;
  background:#0E3471;
  color:white;
  cursor:pointer;
  border-radius:8px;
}

/* LISTAS */
.lista { margin-top:15px; }
.item {
  padding:8px;
  border-bottom:1px solid rgba(0,0,0,0.3);
}

/* CANVAS */
canvas {
  width:100%;
  height:200px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<canvas id="grafico"></canvas>

<div class="nav">
  <button onclick="irInicio()">Inicio</button>
  <button onclick="irAlmacen()">Almacén</button>
  <button onclick="irHistorico()">Histórico</button>
</div>

<div class="kpis">

  <div class="card">
    <h2 id="kpiConsumo">0</h2>
    <p>Consumo total</p>
  </div>

  <div class="card">
    <h2 id="kpiRec">0</h2>
    <p>Recambios activos</p>
  </div>

  <div class="card amarillo">
    <h2 id="kpiCritico">0</h2>
    <p>% críticos</p>
  </div>

  <div class="card rojo">
    <h2 id="kpiBajo">0</h2>
    <p>Bajo mínimo</p>
  </div>

  <div class="card azul">
    <h2 id="kpiAlto">0</h2>
    <p>Sobre stock</p>
  </div>

</div>

<div class="lista">
  <h3>🔥 Top consumo</h3>
  <div id="top"></div>
</div>

<div class="lista">
  <h3>👷 Consumo por usuario</h3>
  <div id="usuarios"></div>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=90";

// 🔐 ACCESO
let sesion = JSON.parse(localStorage.getItem("sesion"));

if (!sesion || !["Alberto","Jose Luis"].includes(sesion.usuario)) {
  alert("Acceso restringido");
  location="index.html";
}

let MOV=[], REC=[];

window.onload = async ()=>{

  const res = await fetch(API_URL);
  const json = await res.json();

  MOV = json.movimientos;

  REC = json.recambios.filter(r =>
    String(r.activo).toUpperCase() === "SI"
  );

  calcular();
};

// KPIs
function calcular(){

  let consumo = MOV
    .filter(m=>m.tipo==="salida")
    .reduce((a,b)=>a+Number(b.cantidad),0);

  let recTotal = REC.length;

  let crit = REC.filter(r=>String(r.critico).toUpperCase()==="SI").length;
  let critPct = recTotal ? Math.round((crit/recTotal)*100) : 0;

  let bajo = REC.filter(r=>Number(r.stock) < Number(r.min)).length;
  let alto = REC.filter(r=>Number(r.stock) > Number(r.max)).length;

  kpiConsumo.innerText = consumo;
  kpiRec.innerText = recTotal;
  kpiCritico.innerText = critPct + "%";
  kpiBajo.innerText = bajo;
  kpiAlto.innerText = alto;

  topConsumo();
  consumoUsuarios();
  dibujarGrafico(bajo, alto, crit);
}

// TOP
function topConsumo(){

  let uso={};

  MOV.forEach(m=>{
    if(m.tipo==="salida")
      uso[m.codigo]=(uso[m.codigo]||0)+Number(m.cantidad);
  });

  top.innerHTML = Object.entries(uso)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .map(t=>`<div class="item">${t[0]} → ${t[1]}</div>`)
    .join("");
}

// USUARIOS
function consumoUsuarios(){

  let uso={};

  MOV.forEach(m=>{
    if(m.tipo==="salida")
      uso[m.usuario]=(uso[m.usuario]||0)+Number(m.cantidad);
  });

  usuarios.innerHTML = Object.entries(uso)
    .sort((a,b)=>b[1]-a[1])
    .map(u=>`<div class="item">${u[0]} → ${u[1]}</div>`)
    .join("");
}

// 📊 GRÁFICO SIMPLE
function dibujarGrafico(bajo, alto, crit){

  const ctx = document.getElementById("grafico").getContext("2d");

  const data = [bajo, alto, crit];
  const total = data.reduce((a,b)=>a+b,0);

  let start = 0;

  data.forEach((v,i)=>{
    let angle = (v/total) * Math.PI*2;

    ctx.beginPath();
    ctx.moveTo(150,100);
    ctx.arc(150,100,80,start,start+angle);
    ctx.fillStyle = ["#ffb3b3","#0E3471","#fff3b0"][i];
    ctx.fill();

    start += angle;
  });
}

// NAV
function irInicio(){ location="index.html"; }
function irAlmacen(){ location="almacen.html"; }
function irHistorico(){ location="historico.html"; }

</script>

</body>
</html>
