<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  position: sticky;
  top:0;
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container { padding:10px; }

.kpis {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:20px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-size:14px;
}

.rojo { background:#ff4d4d; color:white; }
.azul { background:#0E3471; color:white; }
.amarillo { background:#fff3b0; }
.verde { background:#d4edda; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}

th, td {
  padding:8px;
  border-bottom:1px solid rgba(0,0,0,0.2);
  text-align:center;
}

td.nombre { text-align:left; }

.seccion { margin-top:15px; }

.filtrosTiempo {
  display:flex;
  gap:5px;
}
.filtrosTiempo button { flex:1; }

button {
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
  background:#0E3471;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<!-- KPIs -->
<div class="kpis" id="kpis"></div>

<!-- TABLAS -->
<div id="tablaBajo"></div>
<div id="tablaAlto"></div>

<!-- CONSUMO -->
<div class="seccion">
  <h4>📊 Consumo (Consumibles)</h4>

  <div class="filtrosTiempo">
    <button onclick="setFiltro('hoy')">Hoy</button>
    <button onclick="setFiltro('semana')">Semana</button>
    <button onclick="setFiltro('mes')">Mes</button>
    <button onclick="setFiltro('siempre')">Siempre</button>
  </div>

  <div id="consumo"></div>
</div>

<!-- HISTÓRICO -->
<div class="seccion">
  <h4>📜 Histórico (Consumibles)</h4>
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Cantidad</th>
      </tr>
    </thead>
    <tbody id="hist"></tbody>
  </table>
</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=100";

let TODOS=[], REC=[], MOV=[];
let mostrarBajo=false, mostrarAlto=false;
let filtroTiempo="siempre";

// HELPERS
function n(v){ return Number(v)||0; }

function esConsumible(r){
  return String(r.almacen||"").trim().toLowerCase()==="consumibles";
}

window.onload=async()=>{

  const res=await fetch(API_URL);
  const json=await res.json();

  TODOS = json.recambios || [];
  REC = TODOS.filter(esConsumible);
  MOV = json.movimientos || [];

  renderKPIs();
  renderHist();
  renderConsumo();
};

// 🔴 KPIs (TODOS)
function renderKPIs(){

  let bajo=TODOS.filter(r=>n(r.stock)<n(r.min));
  let alto=TODOS.filter(r=>n(r.stock)>n(r.max));
  let crit=TODOS.filter(r=>String(r.critico).toUpperCase()==="SI");

  kpis.innerHTML=`
    <div class="card rojo" onclick="toggleBajo()">
      Bajo mínimo<br><b>${bajo.length}</b>
    </div>

    <div class="card azul" onclick="toggleAlto()">
      Sobre máximo<br><b>${alto.length}</b>
    </div>

    <div class="card amarillo">
      Críticos<br><b>${crit.length}</b>
    </div>

    <div class="card verde">
      Total<br><b>${TODOS.length}</b>
    </div>
  `;
}

// 🟢 TOGGLE TABLAS (Consumibles)
function toggleBajo(){
  mostrarBajo=!mostrarBajo;
  renderTablas();
}

function toggleAlto(){
  mostrarAlto=!mostrarAlto;
  renderTablas();
}

// TABLAS
function renderTablas(){

  let bajo=REC.filter(r=>n(r.stock)<n(r.min));
  let alto=REC.filter(r=>n(r.stock)>n(r.max));

  tablaBajo.innerHTML = mostrarBajo ? tabla("Bajo mínimo (Consumibles)", bajo) : "";
  tablaAlto.innerHTML = mostrarAlto ? tabla("Sobre máximo (Consumibles)", alto) : "";
}

function tabla(titulo,data){
  return `
  <div class="seccion">
    <h4>${titulo}</h4>
    <table>
      <tr><th>Código</th><th>Nombre</th><th>Stock</th></tr>
      ${data.map(r=>`
        <tr>
          <td>${r.codigo}</td>
          <td class="nombre">${r.nombre}</td>
          <td>${n(r.stock)}</td>
        </tr>
      `).join("")}
    </table>
  </div>`;
}

// 🔵 FILTRO TIEMPO
function setFiltro(f){
  filtroTiempo=f;
  renderConsumo();
}

// 🟣 CONSUMO (Consumibles)
function renderConsumo(){

  let now=new Date();

  let filtrado=MOV.filter(m=>{
    let f=new Date(m.fecha);

    if(filtroTiempo==="hoy") return f.toDateString()===now.toDateString();
    if(filtroTiempo==="semana") return (now-f)<7*86400000;
    if(filtroTiempo==="mes") return (now-f)<30*86400000;

    return true;
  });

  filtrado = filtrado.filter(m =>
    REC.find(r=>r.codigo==m.codigo)
  );

  let uso={};

  filtrado
    .filter(m=>m.tipo==="salida")
    .forEach(m=>{
      uso[m.codigo]=(uso[m.codigo]||0)+n(m.cantidad);
    });

  let lista=Object.entries(uso).sort((a,b)=>b[1]-a[1]);

  consumo.innerHTML=`
    Total: <b>${lista.reduce((a,b)=>a+b[1],0)}</b><br><br>
    ${lista.map(([c,v])=>{
      let nom=REC.find(r=>r.codigo==c)?.nombre||"";
      return `${c} - ${nom}: ${v}`;
    }).join("<br>")}
  `;
}

// 🟤 HISTÓRICO (Consumibles)
function renderHist(){

  let mov = MOV.filter(m =>
    REC.find(r=>r.codigo==m.codigo)
  );

  hist.innerHTML = mov.slice(-20).reverse().map(m=>`
    <tr>
      <td>${m.fecha}</td>
      <td>${m.codigo}</td>
      <td>${REC.find(r=>r.codigo==m.codigo)?.nombre||""}</td>
      <td>${m.tipo}</td>
      <td>${n(m.cantidad)}</td>
    </tr>
  `).join("");
}
</script>

</body>
</html>
