<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  position: sticky;
  top:0;
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container { padding:10px; }

.kpis {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:20px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.rojo { background:#ff4d4d; color:white; }
.azul { background:#0E3471; color:white; }
.amarillo { background:#fff3b0; }
.verde { background:#d4edda; }

button {
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
  background:#0E3471;
  color:white;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}

th, td {
  padding:8px;
  border-bottom:1px solid rgba(0,0,0,0.2);
  text-align:center;
}

td.nombre { text-align:left; }

.filtrosTiempo {
  display:flex;
  gap:5px;
}
.filtrosTiempo button { flex:1; }

.seccion { margin-top:15px; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<div class="kpis" id="kpis"></div>

<div id="tablaBajo"></div>
<div id="tablaAlto"></div>

<div class="seccion">
  <h4>📊 Consumo</h4>

  <div class="filtrosTiempo">
    <button onclick="setFiltro('hoy')">Hoy</button>
    <button onclick="setFiltro('semana')">Semana</button>
    <button onclick="setFiltro('mes')">Mes</button>
    <button onclick="setFiltro('siempre')">Siempre</button>
  </div>

  <div id="consumo"></div>
</div>

<div class="seccion">
  <h4>📜 Histórico Consumibles</h4>
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Cantidad</th>
      </tr>
    </thead>
    <tbody id="hist"></tbody>
  </table>
</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=80";

let REC=[];
let MOV=[];
let mostrarBajo=false;
let mostrarAlto=false;
let filtroTiempo="siempre";

window.onload=async()=>{

  const res=await fetch(API_URL);
  const json=await res.json();

  REC=(json.recambios||[])
    .filter(r=>r.almacen==="Consumibles");

  MOV=json.movimientos||[];

  renderKPIs();
  renderHist();
  renderConsumo();
};

// KPIs
function renderKPIs(){

  let bajo=REC.filter(r=>Number(r.stock)<Number(r.min));
  let alto=REC.filter(r=>Number(r.stock)>Number(r.max));
  let crit=REC.filter(r=>String(r.critico).toUpperCase()==="SI");

  kpis.innerHTML=`
    <div class="card rojo" onclick="toggleBajo()">
      Bajo mínimo<br><b>${bajo.length}</b>
    </div>

    <div class="card azul" onclick="toggleAlto()">
      Sobre máximo<br><b>${alto.length}</b>
    </div>

    <div class="card amarillo">
      Críticos<br><b>${crit.length}</b>
    </div>

    <div class="card verde">
      Total<br><b>${REC.length}</b>
    </div>
  `;
}

// TOGGLE
function toggleBajo(){ mostrarBajo=!mostrarBajo; renderTablas(); }
function toggleAlto(){ mostrarAlto=!mostrarAlto; renderTablas(); }

// TABLAS
function renderTablas(){

  let bajo=REC.filter(r=>Number(r.stock)<Number(r.min));
  let alto=REC.filter(r=>Number(r.stock)>Number(r.max));

  tablaBajo.innerHTML = mostrarBajo ? generarTabla("Bajo mínimo", bajo) : "";
  tablaAlto.innerHTML = mostrarAlto ? generarTabla("Sobre máximo", alto) : "";
}

function generarTabla(titulo,data){
  return `
  <div class="seccion">
    <h4>${titulo}</h4>
    <table>
      <tr>
        <th>Código</th><th>Nombre</th><th>Stock</th>
      </tr>
      ${data.map(r=>`
        <tr>
          <td>${r.codigo}</td>
          <td class="nombre">${r.nombre}</td>
          <td>${r.stock}</td>
        </tr>
      `).join("")}
    </table>
  </div>`;
}

// FILTRO TIEMPO
function setFiltro(f){
  filtroTiempo=f;
  renderConsumo();
}

// CONSUMO
function renderConsumo(){

  let now=new Date();

  let filtrado=MOV.filter(m=>{

    let fecha=new Date(m.fecha);

    if(filtroTiempo==="hoy")
      return fecha.toDateString()===now.toDateString();

    if(filtroTiempo==="semana")
      return (now-fecha)<7*86400000;

    if(filtroTiempo==="mes")
      return (now-fecha)<30*86400000;

    return true;
  });

  // SOLO CONSUMIBLES
  filtrado = filtrado.filter(m =>
    REC.find(r=>r.codigo==m.codigo)
  );

  // AGRUPAR CONSUMO
  let uso={};

  filtrado
    .filter(m=>m.tipo==="salida")
    .forEach(m=>{
      let key=m.codigo;
      uso[key]=(uso[key]||0)+Number(m.cantidad);
    });

  let lista = Object.entries(uso)
    .sort((a,b)=>b[1]-a[1]);

  consumo.innerHTML=`
    Consumo total: <b>${lista.reduce((a,b)=>a+b[1],0)}</b><br><br>
    ${lista.map(([cod,val])=>{
      let nombre = REC.find(r=>r.codigo==cod)?.nombre || "";
      return `${cod} - ${nombre}: ${val}`;
    }).join("<br>")}
  `;
}

// HISTÓRICO
function renderHist(){

  let movConsumibles = MOV.filter(m =>
    REC.find(r=>r.codigo==m.codigo)
  );

  hist.innerHTML = movConsumibles.slice(-20).reverse().map(m=>`
    <tr>
      <td>${m.fecha}</td>
      <td>${m.codigo}</td>
      <td>${REC.find(r=>r.codigo==m.codigo)?.nombre || ""}</td>
      <td>${m.tipo}</td>
      <td>${m.cantidad}</td>
    </tr>
  `).join("");
}
</script>

</body>
</html>
