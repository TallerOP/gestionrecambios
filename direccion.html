<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.5;
  z-index:-1;
}

.header {
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container {
  padding:15px;
}

/* BOTONES */
.grid {
  display:flex;
  justify-content:space-between;
  gap:2%;
  margin-top:20px;
}

.grid button {
  width:32.75%;
  height:120px;
  font-size:18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#0E3471;
  color:white;
  box-shadow:0 3px 6px rgba(0,0,0,0.2);
}

.grid button:hover {
  opacity:0.9;
}

.volver {
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#333;
  color:white;
  border:none;
  border-radius:12px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Gestión App</h2>
</div>

<div class="container">

<div class="grid">
  <button onclick="go('recambios.html')">Recambios</button>
  <button onclick="go('consumibles.html')">Consumibles</button>
  <button onclick="go('carros.html')">Carros</button>
</div>

<button class="volver" onclick="go('index.html')">⬅ Volver</button>

</div>

<script>
function go(p){ window.location.href = p; }
</script>

</body>
</html>
