<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; text-align:center; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  padding:20px;
  background:rgba(255,255,255,0.95);
}

.container { padding:20px; }

button {
  width:100%;
  padding:20px;
  margin:15px 0;
  border:none;
  border-radius:12px;
  font-size:18px;
  background:#0E3471;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Gestión App</h2>
</div>

<div class="container">

<button onclick="go('recambios.html')">📦 Recambios</button>
<button onclick="go('consumibles.html')">🧰 Consumibles</button>

</div>

<script>
function go(p){ window.location.href=p; }
</script>

</body>
</html>
