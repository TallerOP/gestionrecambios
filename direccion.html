<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

/* FONDO CENTRADO */
body::before {
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("op.png") no-repeat center center;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* CONTENEDOR */
.container {
  padding:15px;
}

/* BOTONES GRID */
.botones {
  display:flex;
  gap:10px;
}

/* BOTONES */
button {
  flex:1;
  padding:25px;
  border:none;
  border-radius:12px;
  font-size:18px;
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

button:hover {
  opacity:0.9;
}

/* BOTÓN VOLVER */
.volver {
  margin-top:20px;
  width:100%;
  background:#555;
}

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Estadísticas</h2>
</div>

<div class="container">

<div class="botones">
  <button onclick="go('recambios.html')">📦 Recambios</button>
  <button onclick="go('consumibles.html')">🧰 Consumibles</button>
</div>

<button class="volver" onclick="volver()">⬅ Volver al inicio</button>

</div>

<script>
function go(p){
  window.location.href = p;
}

function volver(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
