<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  position:sticky;
  top:0;
  background:white;
  text-align:center;
  padding:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.container { padding:10px; }

button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.2);
  transition:0.2s;
}

button:hover { filter:brightness(1.1); }

button:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 rgba(0,0,0,0.2);
}

.nav {
  display:flex;
  gap:6px;
}

.nav button { flex:1; }

.kpis {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:15px;
  border-radius:10px;
  background:#f5f5f5;
  text-align:center;
}

.rojo { background:#ffb3b3; }
.azul { background:#0E3471; color:white; }
.amarillo { background:#fff3b0; }

.item {
  padding:8px;
  border-bottom:1px solid rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<div class="nav">
  <button onclick="location='index.html'">Inicio</button>
  <button onclick="location='almacen.html'">Almacén</button>
  <button onclick="location='historico.html'">Histórico</button>
</div>

<div class="kpis">
  <div class="card">KPIs</div>
</div>

</div>

<script>
// TU JS ORIGINAL SIN CAMBIOS
</script>

</body>
</html>
