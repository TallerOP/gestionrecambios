<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

.container { padding:10px; }

button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.2);
}

button:hover { filter:brightness(1.1); }

.nav { display:flex; gap:6px; }
.nav button { flex:1; }

.kpis {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.rojo { background:#ffb3b3; }
.azul { background:#0E3471; color:white; }
.amarillo { background:#fff3b0; }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<div class="nav">
  <button onclick="location='index.html'">Inicio</button>
  <button onclick="location='almacen.html'">Almacén</button>
  <button onclick="location='historico.html'">Histórico</button>
</div>

<div class="kpis" id="kpis"></div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=200";

let sesion=JSON.parse(localStorage.getItem("sesion"));
if(!["Alberto","Jose Luis"].includes(sesion?.usuario)) location="index.html";

window.onload=async()=>{
  const res=await fetch(API_URL);
  const DATA=await res.json();

  let bajo=DATA.recambios.filter(r=>r.stock<r.min).length;
  let alto=DATA.recambios.filter(r=>r.stock>r.max).length;
  let activos=DATA.recambios.filter(r=>r.activo==="SI").length;

  kpis.innerHTML=`
    <div class="card rojo">Bajo mínimo<br>${bajo}</div>
    <div class="card azul">Sobre stock<br>${alto}</div>
    <div class="card amarillo">Activos<br>${activos}</div>
  `;
};
</script>

</body>
</html>
