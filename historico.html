<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=300";

let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) location="login.html";

let DATA={};

window.onload=async()=>{
  const res=await fetch(API_URL);
  DATA=await res.json();
  render();
};

function render(){

  let filtro = buscar.value.toLowerCase();

  tabla.innerHTML = DATA.movimientos

  // 🔐 FILTRO POR ALMACÉN (IMPORTANTE)
  .filter(m => {
    if (sesion.almacen === "Todos") return true;

    let r = DATA.recambios.find(x => x.codigo == m.codigo);
    return r && r.almacen === sesion.almacen;
  })

  .filter(m =>
    m.codigo.includes(filtro) ||
    (m.orden || "").toLowerCase().includes(filtro)
  )

  .slice(-200)

  .map(m => {
    let r = DATA.recambios.find(x => x.codigo == m.codigo);
    let nombre = r ? r.nombre : "";

    return `<tr>
      <td>${m.fecha}</td>
      <td>${m.codigo}</td>
      <td>${nombre}</td>
      <td>${m.tipo}</td>
      <td>${m.usuario}</td>
      <td contenteditable="true">${m.orden || ""}</td>
      <td>${m.cantidad}</td>
    </tr>`;
  }).join("");
}

buscar.oninput = render;
</script>
