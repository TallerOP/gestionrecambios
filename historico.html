<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Histórico</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

.container { padding:10px; }

input, button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
}

input { border:1px solid #ccc; }

button {
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.2);
}

button:hover { filter:brightness(1.1); }

/* NAV */
.nav { display:flex; gap:6px; }
.nav button { flex:1; }

/* TABLA */
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:8px; text-align:center; }
tr { border-bottom:1px solid rgba(0,0,0,0.2); }

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<input id="buscar" placeholder="Buscar...">

<div class="nav">
  <button onclick="location='index.html'">Inicio</button>
  <button onclick="location='almacen.html'">Almacén</button>
</div>

<table>
<thead>
<tr>
<th>Fecha</th><th>Código</th><th>Nombre</th>
<th>Tipo</th><th>Usuario</th><th>OT</th><th>Cantidad</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=200";

let sesion=JSON.parse(localStorage.getItem("sesion"));
if(!sesion) location="login.html";

let DATA={};

window.onload=async()=>{
  const res=await fetch(API_URL);
  DATA=await res.json();
  render();
};

function render(){
  let f=buscar.value.toLowerCase();

  tabla.innerHTML=DATA.movimientos
  .filter(m=>m.codigo.includes(f) || (m.orden||"").includes(f))
  .slice(-200)
  .map(m=>{
    let r=DATA.recambios.find(x=>x.codigo==m.codigo);
    let nombre=r?r.nombre:"";

    return `<tr>
      <td>${m.fecha}</td>
      <td>${m.codigo}</td>
      <td>${nombre}</td>
      <td>${m.tipo}</td>
      <td>${m.usuario}</td>
      <td contenteditable="true">${m.orden||""}</td>
      <td>${m.cantidad}</td>
    </tr>`;
  }).join("");
}

buscar.oninput=render;
</script>

</body>
</html>
