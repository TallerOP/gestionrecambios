<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Histórico</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.5;
  z-index:-1;
}

.header {
  position:sticky;
  top:0;
  z-index:1000;
  text-align:center;
  padding:12px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container { padding:10px; }

input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0E3471;
  color:white;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th, td {
  padding:8px;
  text-align:center;
}

thead th {
  position:sticky;
  top:120px;
  background:#f5f5f5;
  cursor:pointer;
}

.nombre { text-align:left; }
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Histórico</h3>
</div>

<div class="container">

<button onclick="volver()">⬅ Volver</button>

<input id="buscador" placeholder="Buscar..." oninput="filtrar()">

<table>
<thead>
<tr>
<th onclick="ordenar('fecha')">Fecha</th>
<th onclick="ordenar('codigo')">Código</th>
<th>Nombre</th>
<th onclick="ordenar('tipo')">Tipo</th>
<th onclick="ordenar('usuario')">Usuario</th>
<th onclick="ordenar('orden')">OT</th>
<th onclick="ordenar('cantidad')">Cantidad</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=40";

/* CACHE */
const CACHE_KEY="data_cache";
const CACHE_TIME=60000;

async function getData(){
  let c=JSON.parse(localStorage.getItem(CACHE_KEY));
  let now=Date.now();

  if(c && now-c.timestamp<CACHE_TIME) return c.data;

  let r=await fetch(API_URL);
  let d=await r.json();

  localStorage.setItem(CACHE_KEY,JSON.stringify({timestamp:now,data:d}));
  return d;
}

let DATA=[], RECAMBIOS=[], FILTRADOS=[];
let ordenCampo="", asc=true;

/* LOAD */
document.addEventListener("DOMContentLoaded", async ()=>{
  let json=await getData();

  DATA=json.movimientos||[];
  RECAMBIOS=json.recambios||[];

  mapear();
  FILTRADOS=DATA;
  render();
});

/* MAPEAR */
function mapear(){
  DATA = DATA.map(m=>{
    let r = RECAMBIOS.find(x=>x.codigo==m.codigo);
    return {...m, nombre:r?r.nombre:"-"};
  });
}

/* FILTRO */
function filtrar(){
  let v=buscador.value.toLowerCase();

  FILTRADOS = DATA.filter(m =>
    String(m.codigo).includes(v) ||
    String(m.nombre).toLowerCase().includes(v) ||
    String(m.usuario).toLowerCase().includes(v) ||
    String(m.orden).toLowerCase().includes(v)
  );

  render();
}

/* ORDEN */
function ordenar(c){
  asc = (ordenCampo===c)?!asc:true;
  ordenCampo=c;

  FILTRADOS.sort((a,b)=>{
    let v1=a[c]||"", v2=b[c]||"";
    v1=isNaN(v1)?v1.toLowerCase():+v1;
    v2=isNaN(v2)?v2.toLowerCase():+v2;
    return (v1>v2?1:-1)*(asc?1:-1);
  });

  render();
}

/* RENDER */
function render(){
  tabla.innerHTML = FILTRADOS.slice().reverse().map(m=>`
    <tr>
      <td>${m.fecha||""}</td>
      <td>${m.codigo}</td>
      <td class="nombre">${m.nombre}</td>
      <td>${m.tipo}</td>
      <td>${m.usuario}</td>
      <td>${m.orden||""}</td>
      <td>${m.cantidad}</td>
    </tr>
  `).join("");
}

/* NAV */
function volver(){ location.href="almacen.html"; }
</script>

</body>
</html>
