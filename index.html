<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* SCANNER */
#scannerBox {
  width:100%;
  background:#e6f2ff;
  padding:10px;
  box-sizing:border-box;
}

#reader {
  width:100%;
}

/* CONTENEDOR */
.container {
  padding:15px;
}

/* INPUTS FULL WIDTH REAL */
input {
  width:100%;
  padding:15px;
  margin:5px 0;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

/* BOTONES */
button {
  width:100%;
  padding:18px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer; /* 👈 cursor PC */
}

button:hover {
  opacity:0.9;
}

.btn { background:#ddd; }
.btn-ok { background:#22c55e; }
.btn-out { background:#ef4444; color:white; }

/* GRID */
.grid {
  display:flex;
  gap:10px;
}

.grid button {
  width:50%;
}

/* NAV */
.nav {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.nav button {
  width:50%;
  font-size:18px;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button id="btnLogin" class="btn-ok">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<!-- SCANNER -->
<div id="scannerBox">
  <button onclick="iniciarScanner()" class="btn">📷 Escanear</button>
  <div id="reader"></div>
</div>

<div class="container">

<input id="codigo" placeholder="Código">
<input id="cantidad" type="number" value="1">
<input id="ot" placeholder="OT">
<input id="obs" placeholder="Observaciones">

<div class="grid">
  <button onclick="registrar('entrada')" class="btn-ok">Entrada</button>
  <button onclick="registrar('salida')" class="btn-out">Salida</button>
</div>

<div class="nav">
  <button onclick="irAlmacen()" class="btn">📦 Almacén</button>
  <button onclick="irHistorico()" class="btn">📊 Histórico</button>
</div>

<button onclick="logout()" class="btn-out" style="margin-top:10px;">
  Salir
</button>

</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=5";

let DATA = {};
let scanner = null;

// SONIDO
const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// INIT
window.onload = async () => {
  await cargarDatos();

  document.getElementById("btnLogin").addEventListener("click", login);

  checkSesion();
};

// SESIÓN
function checkSesion() {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (!sesion) return;

  const ahora = Date.now();
  const duracion = 8 * 60 * 60 * 1000;

  if (ahora - sesion.timestamp < duracion) {
    entrarApp();
  } else {
    localStorage.removeItem("sesion");
  }
}

// LOGIN
function login() {
  const nombre = document.getElementById("login_nombre").value.trim();
  const pin = document.getElementById("login_pin").value.trim();

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) return alert("Error login");

  localStorage.setItem("sesion", JSON.stringify({
    usuario:nombre,
    timestamp:Date.now()
  }));

  entrarApp();
}

// UI
function entrarApp() {
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

// LOGOUT
function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// NAV
function irHistorico() {
  window.location.href = "historico.html";
}

function irAlmacen() {
  window.location.href = "almacen.html";
}

// DATA
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
}

// SCANNER
function iniciarScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start({ facingMode:"environment" }, { fps:10 },
    (txt) => {
      document.getElementById("codigo").value = txt;
      beep.play(); // 🔊 sonido escaneo
      scanner.stop();
      document.getElementById("cantidad").focus();
    });
}

// REGISTRAR
function registrar(tipo) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  const data = {
    codigo: document.getElementById("codigo").value,
    tipo,
    usuario: sesion?.usuario || "desconocido",
    cantidad: document.getElementById("cantidad").value,
    orden: document.getElementById("ot").value,
    observaciones: document.getElementById("obs").value
  };

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  });

  beep.play(); // 🔊 sonido registro

  limpiarCampos();
}

// LIMPIEZA + FOCO
function limpiarCampos() {
  document.getElementById("codigo").value = "";
  document.getElementById("cantidad").value = 1;
  document.getElementById("ot").value = "";
  document.getElementById("obs").value = "";

  document.getElementById("codigo").focus();
}
</script>

</body>
</html>
