<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.1;
  z-index:-1;
}

/* HEADER */
.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

/* CONTENIDO */
.container { padding:10px; }

input, button {
  width:100%;
  padding:12px;
  margin:5px 0;
  box-sizing:border-box;
}

button {
  background:#0E3471;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover { opacity:0.9; }

/* BOTONES ABAJO */
.nav {
  display:flex;
  gap:5px;
  margin-top:10px;
}

.nav button {
  flex:1;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<h3>📦 Movimiento de recambios</h3>

<input id="codigo" placeholder="Código">
<input id="nombre" placeholder="Nombre" disabled>
<input id="cantidad" type="number" min="1" placeholder="Cantidad">
<input id="ot" placeholder="OT">

<button onclick="registrar('entrada')">Entrada</button>
<button onclick="registrar('salida')">Salida</button>

<div class="nav">
  <button onclick="irAlmacen()">Almacén</button>
  <button onclick="irHistorico()">Histórico</button>
  <button onclick="logout()">Salir</button>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=100";

// 🔐 CONTROL SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));

if (!sesion) {
  location="login.html";
}

let DATA = {};

// INIT
window.onload = async ()=>{
  await cargarDatos();
};

// CARGA
async function cargarDatos(){

  let cache = localStorage.getItem("data_cache");

  if (cache) {
    DATA = JSON.parse(cache);
  }

  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    DATA = json;
    localStorage.setItem("data_cache", JSON.stringify(DATA));

  } catch(e) {
    console.log("Offline");
  }
}

// AUTOCOMPLETAR NOMBRE
codigo.addEventListener("input", ()=>{

  let r = DATA.recambios.find(x =>
    x.codigo == codigo.value &&
    x.activo === "SI"
  );

  nombre.value = r ? r.nombre : "";
});

// REGISTRAR
function registrar(tipo){

  let sesion = JSON.parse(localStorage.getItem("sesion"));
  let cant = Number(cantidad.value);

  if (!cant || cant <= 0)
    return alert("Cantidad inválida");

  let r = DATA.recambios.find(x => x.codigo == codigo.value);

  if (!r) return alert("Código no existe");

  // 🔐 CONTROL ALMACÉN
  if (sesion.almacen !== "TODOS" && r.almacen !== sesion.almacen) {
    return alert("No tienes acceso a este almacén");
  }

  if (tipo==="salida" && cant > Number(r.stock)) {
    return alert("Stock insuficiente");
  }

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      codigo: codigo.value,
      cantidad: cant,
      tipo,
      usuario: sesion.usuario,
      orden: ot.value
    })
  });

  // LIMPIEZA
  codigo.value="";
  nombre.value="";
  cantidad.value="";
  ot.value="";
}

// NAV
function irAlmacen(){ location="almacen.html"; }
function irHistorico(){ location="historico.html"; }

// LOGOUT
function logout(){
  localStorage.removeItem("sesion");
  location="login.html";
}

</script>

</body>
</html>
