<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión Recambios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; margin:0; }
.container { padding:15px; }

input {
  width:100%;
  padding:12px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  border:none;
  border-radius:12px;
  padding:14px;
  cursor:pointer;
}

.row { display:flex; justify-content:space-between; gap:1%; }

.btn {
  width:49.5%;
  color:white;
}

.add { background:green; }
.remove { background:red; }

.nav { display:flex; justify-content:space-between; gap:1%; }
.nav button { width:32.75%; background:#0E3471; color:white; }

#scanner { display:none; }
</style>
</head>

<body>

<div class="container">

<button onclick="toggleScanner()">📷 Escanear código</button>
<div id="scanner"></div>

<input id="codigo" placeholder="Código" readonly>
<input id="nombre" placeholder="Nombre" readonly>
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="ot" placeholder="OT">

<div class="row">
  <button class="btn add" onclick="mov('entrada')">Añadir material</button>
  <button class="btn remove" onclick="mov('salida')">Sacar material</button>
</div>

<div class="nav">
  <button onclick="go('almacen.html')">Almacén</button>
  <button onclick="go('historico.html')">Histórico</button>
  <button id="gestionBtn" style="display:none;" onclick="go('direccion.html')">Gestión</button>
</div>

<button onclick="logout()">Cerrar sesión</button>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=40";

// sesión
let sesion = JSON.parse(localStorage.getItem("sesion"));
if (!sesion) location.href="login.html";

// botón gestión solo admins
if (["Alberto","Jose Luis"].includes(sesion.nombre)){
  document.getElementById("gestionBtn").style.display="block";
}

let DATA=[];

// CACHE
async function getData(){
  let c=JSON.parse(localStorage.getItem("cache"));
  if(c && Date.now()-c.t<60000) return c.d;

  let r=await fetch(API_URL);
  let d=await r.json();

  localStorage.setItem("cache",JSON.stringify({t:Date.now(),d}));
  return d;
}

document.addEventListener("DOMContentLoaded", async ()=>{
  let json=await getData();
  DATA=json.recambios||[];
});

// SCANNER
let scanner, timer, last=null;

function toggleScanner(){
  let div=document.getElementById("scanner");

  if(div.style.display==="none"){
    div.style.display="block";

    scanner = new Html5Qrcode("scanner");

    scanner.start({ facingMode:"environment" }, { fps:10 }, txt=>{
      if(txt!==last){
        last=txt;
        clearTimeout(timer);

        timer=setTimeout(()=>{
          buscar(txt);
          cerrarScanner();
          last=null;
        },2000);
      }
    });

  } else cerrarScanner();
}

function cerrarScanner(){
  document.getElementById("scanner").style.display="none";
  if(scanner) scanner.stop();
}

// BUSCAR
function buscar(c){
  let r = DATA.find(x=>String(x.codigo)==c);

  if(!r) return alert("Código no existe");

  codigo.value = r.codigo;
  nombre.value = r.nombre;
}

// MOVIMIENTO
async function mov(tipo){
  let cod=codigo.value;
  let cant=Number(cantidad.value);

  if(!cod) return alert("Escanea primero");
  if(!cant || cant<=0) return alert("Cantidad inválida");

  let r = DATA.find(x=>String(x.codigo)==cod);

  if(tipo==="salida" && cant > Number(r.stock))
    return alert("Stock insuficiente");

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      tipo,
      codigo:cod,
      cantidad:cant,
      orden:ot.value,
      usuario:sesion.nombre
    })
  });

  alert("Movimiento registrado");
}

// NAV
function go(p){ location.href=p; }
function logout(){ localStorage.clear(); location.href="login.html"; }
</script>

</body>
</html>
