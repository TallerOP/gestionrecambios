<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión Recambios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.5;
  z-index:-1;
}

/* HEADER */
.header {
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.container { padding:15px; }

/* INPUTS */
input {
  width:100%;
  padding:12px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

/* BOTONES */
button {
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

button:hover { opacity:0.9; }

/* ACCIONES */
.row { display:flex; }

.btnEntrada { width:50%; background:green; color:white; }
.btnSalida { width:50%; background:red; color:white; }

/* NAV 3 BOTONES */
.nav {
  display:flex;
  margin-top:10px;
}

.nav button {
  width:33.33%;
  background:#0E3471;
  color:white;
}

/* LOGOUT */
.logout {
  width:100%;
  background:#333;
  color:white;
  margin-top:20px;
}

/* SCANNER */
#scannerBox {
  display:none;
  margin-top:10px;
}

#camera {
  width:100%;
  height:260px;
  border-radius:12px;
  overflow:hidden;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Gestión de recambios OP Mobility Pedrola</h2>
</div>

<div class="container">

<button onclick="toggleScanner()">📷 Escanear código</button>

<div id="scannerBox">
  <div id="camera"></div>
</div>

<input id="codigo" placeholder="Código" readonly>
<input id="nombre" placeholder="Nombre" readonly>
<input id="cantidad" type="number" min="1" step="1" placeholder="Cantidad">
<input id="ot" placeholder="OT">

<div class="row">
  <button class="btnEntrada" onclick="registrar('entrada')">Añadir material</button>
  <button class="btnSalida" onclick="registrar('salida')">Sacar material</button>
</div>

<div class="nav">
  <button onclick="go('almacen.html')">Almacén</button>
  <button onclick="go('historico.html')">Histórico</button>
  <button id="btnStats" onclick="go('direccion.html')" style="display:none">Estadísticas</button>
</div>

<button class="logout" onclick="logout()">Cerrar sesión</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let DATA = [];
let RECAMBIO = null;
let scanning = false;
let lastScanTime = 0;

// SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));
if(!sesion) location.href="login.html";

// BOTÓN ESTADÍSTICAS
if(["alberto","jose luis"].includes(sesion.usuario.toLowerCase())){
  document.getElementById("btnStats").style.display="block";
}

// CARGA
window.onload = async () => {
  let res = await fetch(API_URL);
  let json = await res.json();
  DATA = json.recambios || [];
};

// TOGGLE SCANNER
function toggleScanner(){
  let box = document.getElementById("scannerBox");

  if(box.style.display === "none"){
    box.style.display = "block";
    iniciarScanner();
  } else {
    box.style.display = "none";
    detenerScanner();
  }
}

// INICIAR SCANNER
function iniciarScanner(){

  if(scanning) return;

  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector('#camera'),
      constraints: { facingMode: "environment" }
    },
    decoder: {
      readers: ["code_128_reader","ean_reader","ean_8_reader"]
    }
  }, function(err){
    if(err) return console.error(err);
    Quagga.start();
    scanning = true;
  });

  Quagga.onDetected(data => {

    let now = Date.now();

    // 🔥 2 SEGUNDOS
    if(now - lastScanTime < 2000) return;

    lastScanTime = now;

    let codigoLeido = data.codeResult.code;

    buscarRecambio(codigoLeido);
  });
}

// DETENER
function detenerScanner(){
  if(scanning){
    Quagga.stop();
    scanning = false;
  }
}

// BUSCAR
function buscarRecambio(codigoLeido){

  RECAMBIO = DATA.find(r => String(r.codigo) === String(codigoLeido));

  if(!RECAMBIO){
    sonidoError();
    vibrar();
    alert("Código no existe");
    return;
  }

  codigo.value = RECAMBIO.codigo;
  nombre.value = RECAMBIO.nombre || "";

  sonidoOK();
  vibrar();
}

// VALIDACIÓN
function getCantidad(){

  let num = Number(cantidad.value);

  if(!num || num <= 0) return null;

  if(!Number.isInteger(num)){
    alert("Solo números enteros");
    return null;
  }

  return num;
}

// REGISTRAR
async function registrar(tipo){

  if(!RECAMBIO){
    alert("Escanea un recambio primero");
    return;
  }

  let cant = getCantidad();

  if(!cant){
    alert("Cantidad inválida");
    return;
  }

  let stock = Number(RECAMBIO.stock) || 0;

  if(tipo === "salida" && cant > stock){
    alert("Stock insuficiente");
    sonidoError();
    vibrar();
    return;
  }

  let payload = {
    tipo: tipo,
    codigo: RECAMBIO.codigo,
    cantidad: cant,
    usuario: sesion.usuario,
    orden: ot.value || ""
  };

  try{
    await fetch(API_URL, {
      method:"POST",
      body: JSON.stringify(payload)
    });

    sonidoOK();
    vibrar();

    alert("Movimiento registrado correctamente");

    limpiar();

  }catch(e){
    alert("Error al guardar");
  }
}

// LIMPIAR
function limpiar(){
  codigo.value="";
  nombre.value="";
  cantidad.value="";
  ot.value="";
  RECAMBIO=null;
}

// SONIDOS
function sonidoOK(){ new Audio("ok.mp3").play(); }
function sonidoError(){ new Audio("error.mp3").play(); }

// VIBRAR
function vibrar(){
  if(navigator.vibrate) navigator.vibrate(100);
}

// NAV
function go(p){ window.location.href=p; }

function logout(){
  localStorage.removeItem("sesion");
  location.href="login.html";
}
</script>

</body>
</html>
