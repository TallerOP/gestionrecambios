<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let DATA = [];
let RECAMBIO = null;

// CARGA
window.onload = async () => {

  let sesion = JSON.parse(localStorage.getItem("sesion"));
  if(!sesion) location.href = "login.html";

  let res = await fetch(API_URL);
  let json = await res.json();

  DATA = json.recambios || [];
};

// ESCANEAR
function buscarRecambio(codigo){

  RECAMBIO = DATA.find(r => String(r.codigo) === String(codigo));

  if(!RECAMBIO){
    sonidoError();
    vibrar();
    alert("Código no existe");
    return;
  }

  document.getElementById("nombre").value = RECAMBIO.nombre || "";

  sonidoOK();
  vibrar();
}

// VALIDACIÓN FUERTE DE CANTIDAD
function getCantidad(){

  let val = document.getElementById("cantidad").value;

  // ❌ vacío
  if(!val) return null;

  let num = Number(val);

  // ❌ no número o decimal raro
  if(isNaN(num) || !Number.isFinite(num)) return null;

  // ❌ negativo o cero
  if(num <= 0) return null;

  // ❌ decimal → opcional bloquear
  if(!Number.isInteger(num)){
    alert("Solo cantidades enteras");
    return null;
  }

  return num;
}

// REGISTRAR
async function registrar(tipo){

  if(!RECAMBIO){
    alert("Escanea un recambio primero");
    return;
  }

  let cantidad = getCantidad();

  if(!cantidad){
    alert("Cantidad inválida");
    return;
  }

  let stock = Number(RECAMBIO.stock) || 0;

  // 🔴 CONTROL CRÍTICO SALIDA
  if(tipo === "salida"){

    if(cantidad > stock){
      alert("No puedes sacar más del stock disponible");
      sonidoError();
      vibrar();
      return;
    }
  }

  let sesion = JSON.parse(localStorage.getItem("sesion"));

  let payload = {
    tipo: tipo,
    codigo: RECAMBIO.codigo,
    cantidad: cantidad,
    usuario: sesion.usuario,
    orden: document.getElementById("ot").value || ""
  };

  try{

    await fetch(API_URL, {
      method:"POST",
      body: JSON.stringify(payload)
    });

    sonidoOK();
    vibrar();

    limpiarCampos();

  }catch(e){
    alert("Error al guardar");
    console.error(e);
  }
}

// LIMPIAR
function limpiarCampos(){
  document.getElementById("cantidad").value = "";
  document.getElementById("ot").value = "";
  document.getElementById("nombre").value = "";
  RECAMBIO = null;
}

// SONIDOS
function sonidoOK(){
  new Audio("ok.mp3").play();
}

function sonidoError(){
  new Audio("error.mp3").play();
}

// VIBRACIÓN
function vibrar(){
  if(navigator.vibrate){
    navigator.vibrate(100);
  }
}
</script>
