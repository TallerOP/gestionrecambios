<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.1;
  z-index:-1;
}

/* HEADER */
.header {
  display:flex;
  flex-direction:column; /* 👈 coloca logo arriba y texto debajo */
  align-items:center;   /* 👈 centra todo */
  justify-content:center;
  text-align:center;
  padding:15px 10px;
  border-bottom:1px solid #ccc;
}

.header img {
  height:50px; /* 👈 un poco más grande */
  margin-bottom:5px;
}

.header h3 {
  font-size:20px; /* 👈 texto más grande */
  margin:0;
}

/* SCANNER */
#scannerBox {
  width:100%;
  background:#e6f2ff;
  padding:10px;
}

/* CONTENIDO */
.container { padding:15px; }

input {
  width:100%;
  padding:15px;
  margin:5px 0;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

input[readonly] { background:#eee; }

button {
  width:100%;
  padding:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn { background:#ddd; }
.btn-ok { background:#22c55e; }
.btn-out { background:#ef4444; color:white; }

.grid { display:flex; gap:10px; }
.grid button { width:50%; }

.nav { display:flex; gap:10px; margin-top:10px; }
.nav button { width:50%; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button id="btnLogin" class="btn-ok">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="header">
  <img src="op.png">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div id="scannerBox">
  <button onclick="iniciarScanner()" class="btn">📷 Escanear</button>
  <div id="reader"></div>
</div>

<div class="container">

<input id="codigo" placeholder="Código" oninput="buscarRecambio()">
<input id="nombre" placeholder="Nombre recambio" readonly>

<input id="cantidad" type="number" value="1" min="1">
<input id="ot" placeholder="OT">

<div class="grid">
  <button onclick="registrar('entrada')" class="btn-ok">Entrada</button>
  <button onclick="registrar('salida')" class="btn-out">Salida</button>
</div>

<div class="nav">
  <button onclick="irAlmacen()" class="btn">📦 Almacén</button>
  <button onclick="irHistorico()" class="btn">📊 Histórico</button>
</div>

<button onclick="logout()" class="btn-out" style="margin-top:10px;">Salir</button>

</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=8";

let DATA = {};
let scanner = null;
let ultimoScan = "";
let tiempoScan = 0;

// SONIDOS
const okSound = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const errorSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

// INIT
window.onload = async () => {
  document.getElementById("btnLogin").addEventListener("click", login);
  await cargarDatos();
  checkSesion();
};

// SESIÓN
function checkSesion() {
  const sesion = JSON.parse(localStorage.getItem("sesion"));
  if (!sesion) return;

  if (Date.now() - sesion.timestamp < 28800000) {
    entrarApp();
  } else {
    localStorage.removeItem("sesion");
  }
}

// LOGIN
function login() {
  if (!DATA.usuarios) return alert("Datos no cargados");

  const nombre = document.getElementById("login_nombre").value.trim();
  const pin = document.getElementById("login_pin").value.trim();

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) return alert("Usuario o PIN incorrecto");

  localStorage.setItem("sesion", JSON.stringify({
    usuario: nombre,
    timestamp: Date.now()
  }));

  entrarApp();
}

// UI
function entrarApp() {
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

// LOGOUT
function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// DATA
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
}

// BUSCAR
function buscarRecambio() {
  const cod = document.getElementById("codigo").value;

  const r = DATA.recambios.find(x =>
    x.codigo == cod || x.codigo_sap == cod
  );

  document.getElementById("nombre").value = r ? r.nombre : "";
}

// SCANNER con estabilidad 1s
function iniciarScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start({ facingMode:"environment" }, { fps:10 },
    (txt) => {

      if (txt !== ultimoScan) {
        ultimoScan = txt;
        tiempoScan = Date.now();
        return;
      }

      if (Date.now() - tiempoScan < 1000) return;

      document.getElementById("codigo").value = txt;
      buscarRecambio();

      const existe = DATA.recambios.find(x =>
        x.codigo == txt || x.codigo_sap == txt
      );

      if (existe) {
        okSound.play();
      } else {
        errorSound.play();
      }

      if (navigator.vibrate) navigator.vibrate(100);

      scanner.stop();
    });
}

// REGISTRAR
function registrar(tipo) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));
  const codigo = document.getElementById("codigo").value.trim();
  const cantidad = Number(document.getElementById("cantidad").value);

  if (!cantidad || cantidad <= 0) {
    alert("Cantidad inválida");
    return;
  }

  const recambio = DATA.recambios.find(x =>
    x.codigo == codigo || x.codigo_sap == codigo
  );

  if (!recambio) {
    errorSound.play();
    alert("Recambio no existe");
    return;
  }

  if (tipo === "salida") {
    if (cantidad > Number(recambio.stock)) {
      alert("Stock insuficiente");
      return;
    }
  }

  const data = {
    codigo,
    tipo,
    usuario: sesion?.usuario || "desconocido",
    cantidad,
    orden: document.getElementById("ot").value
  };

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  });

  okSound.play();
  limpiar();
}

// LIMPIAR
function limpiar() {
  document.getElementById("codigo").value="";
  document.getElementById("nombre").value="";
  document.getElementById("cantidad").value=1;
  document.getElementById("ot").value="";
  document.getElementById("codigo").focus();
}

// NAV
function irHistorico(){ window.location.href="historico.html"; }
function irAlmacen(){ window.location.href="almacen.html"; }
</script>

</body>
</html>
