<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<style>
body {
  font-family: Arial;
  background:white;
  color:black;
  margin:0;
}

.container { padding:20px; }

button {
  width:100%;
  padding:20px;
  margin:10px 0;
  font-size:18px;
  border:none;
  border-radius:10px;
}

.btn { background:#ddd; }
.btn-main { background:#22c55e; }
.btn-danger { background:#ef4444; color:white; }
</style>
</head>

<body>

<div id="login" class="container">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button id="btnLogin" class="btn-main">Entrar</button>
</div>

<div id="app" style="display:none;" class="container">

<h2>Menú</h2>

<button onclick="irHistorico()" class="btn">📊 Histórico</button>
<button onclick="irAlmacen()" class="btn">📦 Almacén</button>

<button onclick="logout()" class="btn-danger">Salir</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=2"; // cache bust

let DATA = {};

// INIT
window.onload = async () => {
  await cargarDatos();

  document.getElementById("btnLogin").addEventListener("click", login);

  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    entrarApp();
  }
};

// LOGIN
function login() {
  const nombre = document.getElementById("login_nombre").value.trim();
  const pin = document.getElementById("login_pin").value.trim();

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) return alert("Error login");

  localStorage.setItem("sesion", JSON.stringify({
    usuario:nombre,
    timestamp:Date.now()
  }));

  entrarApp();
}

function entrarApp() {
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
}

// NAV
function irHistorico() {
  window.location.href = "historico.html";
}

function irAlmacen() {
  window.location.href = "almacen.html";
}
</script>

</body>
</html>
