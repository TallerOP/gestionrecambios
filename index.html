<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén PRO</title>

<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
  --bg:#0f172a;
  --primary:#22c55e;
  --danger:#ef4444;
  --text:#fff;
}

body {
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

.container { padding:15px; }

.card {
  background:#1e293b;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
}

button {
  width:100%;
  padding:18px;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin:5px 0;
}

input {
  width:100%;
  padding:15px;
  border-radius:10px;
  border:none;
  margin:5px 0;
  font-size:18px;
}

.btn-primary { background:var(--primary); color:black; }
.btn-danger { background:var(--danger); color:white; }
.btn-sec { background:#334155; color:white; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.big { font-size:22px; padding:25px; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
<h2>Login</h2>
<input id="login_nombre" placeholder="Usuario">
<input id="login_pin" type="password" placeholder="PIN">
<button onclick="login()" class="btn-primary">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;" class="container">

<h2>📦 Almacén</h2>

<button onclick="logout()" class="btn-danger">Salir</button>

<div class="card" id="dashboard"></div>

<div class="card">

<button onclick="toggleScanner()" class="btn-sec big">📷 ESCANEO CONTINUO</button>

<div id="reader"></div>

<input id="codigo" placeholder="Código">
<input id="cantidad" type="number" value="1">

<div class="grid">
<button class="btn-primary big" onclick="modoRapido('entrada')">➕</button>
<button class="btn-danger big" onclick="modoRapido('salida')">➖</button>
</div>

<div id="info"></div>

</div>

<div class="card">
<h3>Histórico</h3>
<div id="historial"></div>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let DATA = {};
let scanner;
let escaneoActivo = false;
let modo = "salida"; // default fábrica

// INIT
window.onload = async () => {
  await cargarDatos();

  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    entrarApp();
  }
};

// LOGIN
function login() {
  const nombre = login_nombre.value.trim();
  const pin = login_pin.value.trim();

  const user = DATA.usuarios.find(u =>
    u.nombre == nombre && u.pin == pin && u.activo == "SI"
  );

  if (!user) return alert("Error login");

  localStorage.setItem("sesion", JSON.stringify({
    usuario:nombre,
    timestamp:Date.now()
  }));

  entrarApp();
}

// UI
function entrarApp() {
  login.style.display="none";
  app.style.display="block";
  pantallaCompleta();
}

function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// FULLSCREEN
function pantallaCompleta() {
  if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}

// CARGA
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
  render();
}

// RENDER
function render() {
  dashboard.innerHTML =
    "Stock bajo: " + DATA.recambios.filter(r=>r.stock<r.min).length;

  historial.innerHTML =
    DATA.movimientos.slice(-10)
      .map(m=>`${m.codigo} ${m.tipo} ${m.cantidad}`)
      .join("<br>");
}

// SCANNER CONTINUO
function toggleScanner() {

  if (!escaneoActivo) {
    scanner = new Html5Qrcode("reader");

    scanner.start({ facingMode:"environment" }, { fps:10 },
      (txt) => {
        onScan(txt);
      });

    escaneoActivo = true;

  } else {
    scanner.stop();
    escaneoActivo = false;
  }
}

// AL ESCANEAR
function onScan(txt) {
  codigo.value = txt;

  feedback();

  autoRegistrar(txt);
}

// FEEDBACK INDUSTRIAL
function feedback() {
  // sonido
  new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg").play();

  // vibración
  if (navigator.vibrate) navigator.vibrate(100);
}

// AUTO REGISTRO
function autoRegistrar(codigoEscaneado) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  const data = {
    codigo: codigoEscaneado,
    tipo: modo,
    usuario: sesion?.usuario || "auto",
    cantidad: 1
  };

  enviar(data);
}

// ENVÍO ROBUSTO
function enviar(data) {
  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  })
  .catch(() => guardarOffline(data));

  cargarDatos();
}

// OFFLINE + SYNC
function guardarOffline(d) {
  let p = JSON.parse(localStorage.getItem("cola")||"[]");
  p.push(d);
  localStorage.setItem("cola", JSON.stringify(p));
}

function sync() {
  let cola = JSON.parse(localStorage.getItem("cola")||"[]");

  cola.forEach(d=>{
    fetch(API_URL,{method:"POST",body:JSON.stringify(d)});
  });

  localStorage.removeItem("cola");
}

// MODO RÁPIDO
function modoRapido(t) {
  modo = t;
  alert("Modo: "+t);
}

// AUTO SYNC
setInterval(sync, 10000);

</script>

</body>
</html>
