<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:white; }

.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

input, button {
  width:100%;
  padding:12px;
  margin:5px 0;
  box-sizing:border-box;
}

button {
  background:#0E3471;
  color:white;
  border:none;
  cursor:pointer;
}

#app { display:none; padding:10px; }
</style>
</head>

<body>

<div id="login" class="header">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario" autocomplete="off">
  <input id="login_pin" type="password" placeholder="PIN" autocomplete="off">
  <button onclick="login()">Entrar</button>
</div>

<div id="app">

<h2>Escaneo</h2>

<input id="codigo" placeholder="Código">
<input id="nombre" placeholder="Nombre" disabled>
<input id="cantidad" type="number" min="1" placeholder="Cantidad">

<input id="ot" placeholder="OT">

<button onclick="registrar('entrada')">Entrada</button>
<button onclick="registrar('salida')">Salida</button>

<button onclick="irAlmacen()">📦 Almacén</button>
<button onclick="irHistorico()">📊 Histórico</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=50";

let DATA = {};

// INIT
window.onload = async () => {

  let sesion = JSON.parse(localStorage.getItem("sesion"));

  await cargarDatos();

  if (sesion) {
    login_ok();
  }
};

// CARGA
async function cargarDatos() {

  let cache = localStorage.getItem("data_cache");

  if (cache) {
    DATA = JSON.parse(cache);
  }

  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    DATA = json;
    localStorage.setItem("data_cache", JSON.stringify(DATA));

  } catch(e) {
    console.log("Offline, usando cache");
  }
}

// LOGIN
function login() {

  if (!DATA.usuarios) {
    alert("Cargando datos...");
    return;
  }

  const nombre = login_nombre.value;
  const pin = login_pin.value;

  const user = DATA.usuarios.find(u =>
    u.nombre === nombre && u.pin == pin && u.activo === "SI"
  );

  if (!user) return alert("Error login");

  localStorage.setItem("sesion", JSON.stringify({
    usuario: nombre,
    timestamp: Date.now()
  }));

  login_ok();
}

function login_ok() {
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

// BUSCAR NOMBRE
codigo.addEventListener("input", ()=>{

  let r = DATA.recambios.find(x =>
    x.codigo == codigo.value
  );

  nombre.value = r ? r.nombre : "";
});

// REGISTRO
function registrar(tipo){

  let cant = Number(cantidad.value);

  if (cant <= 0) return alert("Cantidad inválida");

  let r = DATA.recambios.find(x => x.codigo == codigo.value);

  if (!r) return alert("Código no existe");

  if (tipo==="salida" && cant > Number(r.stock))
    return alert("Sin stock suficiente");

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      codigo: codigo.value,
      cantidad: cant,
      tipo,
      usuario: JSON.parse(localStorage.getItem("sesion")).usuario,
      orden: ot.value
    })
  });

  // LIMPIEZA
  codigo.value="";
  nombre.value="";
  cantidad.value="";
  ot.value="";
}

// NAV
function irAlmacen(){ window.location.href="almacen.html"; }
function irHistorico(){ window.location.href="historico.html"; }

</script>

</body>
</html>
