<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión Recambios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; margin:0; background:white; }
body::before {
  content:""; position:fixed; width:100%; height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%; opacity:0.5; z-index:-1;
}
.header { text-align:center; padding:15px; background:rgba(255,255,255,0.95); }
.container { padding:15px; }

input {
  width:100%; padding:12px; margin:4px 0;
  border-radius:10px; border:1px solid #ccc;
}

button {
  padding:14px; border:none; border-radius:12px;
  cursor:pointer; box-shadow:0 3px 6px rgba(0,0,0,0.2);
}
button:hover { opacity:0.9; }

.btnScan { width:30%; margin:auto; display:block; background:#0E3471; color:white; }

.row { display:flex; justify-content:space-between; margin-top:8px; }
.btnEntrada { width:49.5%; background:green; color:white; }
.btnSalida { width:49.5%; background:red; color:white; }

.nav { display:flex; justify-content:space-between; margin-top:8px; }
.nav button { width:32.75%; background:#0E3471; color:white; }

.logout { width:100%; background:#333; color:white; margin-top:15px; }

#scannerBox { max-height:0; overflow:hidden; transition:0.3s; }
#scannerBox.active { max-height:400px; }
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Gestión de recambios</h2>
</div>

<div class="container">

<button class="btnScan" onclick="toggleScanner()">📷 Escanear</button>

<div id="scannerBox">
  <div id="reader"></div>
</div>

<input id="codigo" placeholder="Código" readonly>
<input id="nombre" placeholder="Nombre" readonly>
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="ot" placeholder="OT">

<div class="row">
  <button class="btnEntrada" onclick="registrar('entrada')">Añadir</button>
  <button class="btnSalida" onclick="registrar('salida')">Sacar</button>
</div>

<div class="nav">
  <button onclick="go('almacen.html')">Almacén</button>
  <button onclick="go('historico.html')">Histórico</button>
</div>

<button class="logout" onclick="logout()">Cerrar sesión</button>

</div>

<script>
const API_URL = "TU_URL";

const CACHE_KEY = "data_cache";
const CACHE_TIME = 60000;

async function getData() {
  let cache = JSON.parse(localStorage.getItem(CACHE_KEY));
  let now = Date.now();

  if (cache && (now - cache.timestamp < CACHE_TIME)) {
    return cache.data;
  }

  let res = await fetch(API_URL);
  let data = await res.json();

  localStorage.setItem(CACHE_KEY, JSON.stringify({
    timestamp: now,
    data: data
  }));

  return data;
}

// precarga
getData();

let DATA = [];
let RECAMBIO = null;

// LOAD
document.addEventListener("DOMContentLoaded", async ()=>{
  let json = await getData();
  DATA = json.recambios || [];
});

// SCANNER (con retardo 2s)
let scanner, codigoDetectado=null, timer;

function toggleScanner(){
  let box = document.getElementById("scannerBox");

  if(!box.classList.contains("active")){
    box.classList.add("active");

    scanner = new Html5Qrcode("reader");

    scanner.start({ facingMode:"environment" }, { fps:10 }, txt=>{
      if(txt !== codigoDetectado){
        codigoDetectado = txt;
        clearTimeout(timer);

        timer = setTimeout(()=>{
          buscar(txt);
          cerrarScanner();
          codigoDetectado=null;
        },2000);
      }
    });

  } else cerrarScanner();
}

function cerrarScanner(){
  document.getElementById("scannerBox").classList.remove("active");
  if(scanner) scanner.stop();
}

// BUSCAR
function buscar(c){
  RECAMBIO = DATA.find(r=>String(r.codigo)==c);
  if(!RECAMBIO) return alert("No existe");

  codigo.value = RECAMBIO.codigo;
  nombre.value = RECAMBIO.nombre;
}

// REGISTRO
async function registrar(tipo){
  if(!RECAMBIO) return alert("Escanea primero");

  let cant = Number(cantidad.value);
  if(!cant || cant<=0) return alert("Cantidad inválida");

  if(tipo==="salida" && cant > Number(RECAMBIO.stock))
    return alert("Stock insuficiente");

  await fetch(API_URL,{method:"POST",body:JSON.stringify({
    tipo, codigo:RECAMBIO.codigo, cantidad:cant, orden:ot.value
  })});

  alert("OK");
}

// NAV
function go(p){ location.href=p; }
function logout(){ localStorage.clear(); location.href="login.html"; }
</script>

</body>
</html>
