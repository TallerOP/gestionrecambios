<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
  color:black;
  position:relative;
}

/* FONDO LOGO */
body::before {
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.1;
  z-index:-1;
}

/* HEADER */
.header {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #ccc;
}

.header img {
  height:40px;
}

.header h1 {
  font-size:16px;
  margin:0;
}

/* SCANNER */
#scannerBox {
  width:100%;
  background:#e6f2ff;
  padding:10px;
  box-sizing:border-box;
}

#reader {
  width:100%;
}

/* CONTENIDO */
.container {
  padding:15px;
}

/* INPUTS */
input {
  width:100%;
  padding:15px;
  margin:5px 0;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

input[readonly] {
  background:#f3f3f3;
}

/* BOTONES */
button {
  width:100%;
  padding:18px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:hover { opacity:0.9; }

.btn { background:#ddd; }
.btn-ok { background:#22c55e; }
.btn-out { background:#ef4444; color:white; }

/* GRID */
.grid {
  display:flex;
  gap:10px;
}

.grid button {
  width:50%;
}

/* NAV */
.nav {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.nav button {
  width:50%;
  font-size:18px;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button id="btnLogin" class="btn-ok">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<!-- HEADER -->
<div class="header">
  <img src="op.png">
  <h1>Gestión de recambios OP Mobility Pedrola</h1>
</div>

<!-- SCANNER -->
<div id="scannerBox">
  <button onclick="iniciarScanner()" class="btn">📷 Escanear</button>
  <div id="reader"></div>
</div>

<div class="container">

<input id="codigo" placeholder="Código" oninput="buscarRecambio()">

<input id="nombre" placeholder="Nombre recambio" readonly>

<input id="cantidad" type="number" value="1">
<input id="ot" placeholder="OT">

<div class="grid">
  <button onclick="registrar('entrada')" class="btn-ok">Entrada</button>
  <button onclick="registrar('salida')" class="btn-out">Salida</button>
</div>

<div class="nav">
  <button onclick="irAlmacen()" class="btn">📦 Almacén</button>
  <button onclick="irHistorico()" class="btn">📊 Histórico</button>
</div>

<button onclick="logout()" class="btn-out" style="margin-top:10px;">
  Salir
</button>

</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=6";

let DATA = {};
let scanner = null;

const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// INIT
window.onload = async () => {
  await cargarDatos();
  document.getElementById("btnLogin").addEventListener("click", login);
  checkSesion();
};

// SESIÓN
function checkSesion() {
  const sesion = JSON.parse(localStorage.getItem("sesion"));
  if (!sesion) return;

  const ahora = Date.now();
  if (ahora - sesion.timestamp < 28800000) {
    entrarApp();
  } else {
    localStorage.removeItem("sesion");
  }
}

// LOGIN
function login() {
  const nombre = login_nombre.value.trim();
  const pin = login_pin.value.trim();

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) return alert("Error login");

  localStorage.setItem("sesion", JSON.stringify({
    usuario:nombre,
    timestamp:Date.now()
  }));

  entrarApp();
}

// UI
function entrarApp() {
  login.style.display="none";
  app.style.display="block";
}

// LOGOUT
function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// DATA
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
}

// BUSCAR RECAMBIO
function buscarRecambio() {
  const cod = document.getElementById("codigo").value;

  const r = DATA.recambios.find(x =>
    x.codigo == cod || x.codigo_sap == cod
  );

  document.getElementById("nombre").value = r ? r.nombre : "";
}

// SCANNER
function iniciarScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start({ facingMode:"environment" }, { fps:10 },
    (txt) => {
      document.getElementById("codigo").value = txt;
      buscarRecambio();
      beep.play();
      scanner.stop();
      document.getElementById("cantidad").focus();
    });
}

// REGISTRAR
function registrar(tipo) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  const data = {
    codigo: codigo.value,
    tipo,
    usuario: sesion?.usuario || "desconocido",
    cantidad: cantidad.value,
    orden: ot.value
  };

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  });

  beep.play();
  limpiar();
}

// LIMPIAR
function limpiar() {
  codigo.value="";
  nombre.value="";
  cantidad.value=1;
  ot.value="";
  codigo.focus();
}

// NAV
function irHistorico() { window.location.href="historico.html"; }
function irAlmacen() { window.location.href="almacen.html"; }
</script>

</body>
</html>
