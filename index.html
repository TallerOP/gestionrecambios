<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("op.png") center no-repeat;
  background-size:60%;
  opacity:0.5;
  z-index:-1;
}

/* HEADER */
.header {
  text-align:center;
  padding:15px;
  background:#eef5ff;
}

/* CONTENIDO */
.container { padding:10px; }

input, button {
  width:100%;
  padding:12px;
  margin:5px 0;
  box-sizing:border-box;
}

/* BOTONES PRINCIPALES */
.botones {
  display:flex;
  gap:5px;
}

.botones button {
  width:50%;
  font-weight:bold;
}

.entrada {
  background:green;
  color:white;
}

.salida {
  background:red;
  color:white;
}

/* NAV */
.nav {
  display:flex;
  gap:5px;
  margin-top:10px;
}

.nav button {
  flex:1;
  background:#0E3471;
  color:white;
}

/* SCANNER */
#reader {
  width:100%;
  display:none;
  margin-top:10px;
}

/* LOGOUT */
.logout {
  margin-top:20px;
}

.logout button {
  background:red;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="40">
  <h3>Gestión de recambios OP Mobility Pedrola</h3>
</div>

<div class="container">

<h3>📦 Movimiento de recambios</h3>

<button onclick="toggleScanner()">📷 Escanear código</button>
<div id="reader"></div>

<input id="codigo" placeholder="Código">
<input id="nombre" placeholder="Nombre" disabled>
<input id="cantidad" type="number" min="1" placeholder="Cantidad">
<input id="ot" placeholder="OT">

<div class="botones">
  <button class="entrada" onclick="registrar('entrada')">Añadir material</button>
  <button class="salida" onclick="registrar('salida')">Sacar material</button>
</div>

<div class="nav">
  <button onclick="irAlmacen()">Almacén</button>
  <button onclick="irHistorico()">Histórico</button>
  <button id="btnDashboard" style="display:none;" onclick="irDashboard()">Estadísticas</button>
</div>

<div class="logout">
  <button onclick="logout()">Cerrar sesión</button>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec?v=110";

// SESIÓN
let sesion = JSON.parse(localStorage.getItem("sesion"));

if (!sesion) location="login.html";

// MOSTRAR DASHBOARD SI PROCEDE
if (["Alberto","Jose Luis"].includes(sesion.usuario)) {
  document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("btnDashboard").style.display="block";
  });
}

let DATA = {};
let scanner = null;
let scannerActivo = false;

// INIT
window.onload = async ()=>{
  await cargarDatos();
};

// CARGA
async function cargarDatos(){

  let cache = localStorage.getItem("data_cache");

  if (cache) DATA = JSON.parse(cache);

  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    DATA = json;
    localStorage.setItem("data_cache", JSON.stringify(DATA));

  } catch(e) {}
}

// SCANNER TOGGLE
function toggleScanner(){

  if (!scannerActivo) {

    document.getElementById("reader").style.display="block";

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      { fps: 10 },
      (txt)=>{
        codigo.value = txt;
        buscarNombre();
        detenerScanner();
      }
    );

    scannerActivo = true;

  } else {
    detenerScanner();
  }
}

function detenerScanner(){
  if (scanner) {
    scanner.stop();
    scanner.clear();
  }
  document.getElementById("reader").style.display="none";
  scannerActivo = false;
}

// AUTOCOMPLETAR
codigo.addEventListener("input", buscarNombre);

function buscarNombre(){
  let r = DATA.recambios.find(x =>
    x.codigo == codigo.value &&
    x.activo === "SI"
  );

  nombre.value = r ? r.nombre : "";
}

// REGISTRAR
function registrar(tipo){

  let cant = Number(cantidad.value);

  if (!cant || cant <= 0)
    return alert("Cantidad inválida");

  let r = DATA.recambios.find(x => x.codigo == codigo.value);

  if (!r) return alert("Código no existe");

  if (sesion.almacen !== "TODOS" && r.almacen !== sesion.almacen)
    return alert("Sin acceso a este almacén");

  if (tipo==="salida" && cant > Number(r.stock))
    return alert("Stock insuficiente");

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      codigo: codigo.value,
      cantidad: cant,
      tipo,
      usuario: sesion.usuario,
      orden: ot.value
    })
  });

  // LIMPIAR
  codigo.value="";
  nombre.value="";
  cantidad.value="";
  ot.value="";
}

// NAV
function irAlmacen(){ location="almacen.html"; }
function irHistorico(){ location="historico.html"; }
function irDashboard(){ location="direccion.html"; }

// LOGOUT
function logout(){
  localStorage.removeItem("sesion");
  location="login.html";
}
</script>

</body>
</html>
