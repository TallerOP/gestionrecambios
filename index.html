<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén PRO</title>

<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
  --bg:#0f172a;
  --primary:#22c55e;
  --danger:#ef4444;
  --text:#fff;
}

body {
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

.container { padding:15px; }

.card {
  background:#1e293b;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
}

button {
  width:100%;
  padding:18px;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin:5px 0;
}

input {
  width:100%;
  padding:15px;
  border-radius:10px;
  border:none;
  margin:5px 0;
  font-size:18px;
}

.btn-primary { background:var(--primary); color:black; }
.btn-danger { background:var(--danger); color:white; }
.btn-sec { background:#334155; color:white; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.big { font-size:22px; padding:25px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button onclick="login()" class="btn-primary">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;" class="container">

<h2>📦 Almacén</h2>

<button onclick="logout()" class="btn-danger">Salir</button>

<div class="card" id="dashboard"></div>

<div class="card">

<button onclick="toggleScanner()" class="btn-sec big">📷 ESCANEO CONTINUO</button>

<div id="reader"></div>

<input id="codigo" placeholder="Código">
<input id="cantidad" type="number" value="1">

<div class="grid">
<button class="btn-primary big" onclick="setModo('entrada')">➕</button>
<button class="btn-danger big" onclick="setModo('salida')">➖</button>
</div>

<div id="info"></div>

</div>

<div class="card">
<h3>Histórico</h3>
<div id="historial"></div>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let DATA = {};
let scanner = null;
let escaneoActivo = false;
let modo = "salida";

// INIT
window.onload = async () => {
  await cargarDatos();

  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    const ahora = Date.now();
    const duracion = 8 * 60 * 60 * 1000;

    if (ahora - sesion.timestamp < duracion) {
      entrarApp();
    } else {
      localStorage.removeItem("sesion");
    }
  }
};

// LOGIN (CORREGIDO)
function login() {
  const nombre = document.getElementById("login_nombre").value.trim();
  const pin = document.getElementById("login_pin").value.trim();

  if (!DATA.usuarios) {
    alert("Datos no cargados");
    return;
  }

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) {
    alert("❌ Usuario o PIN incorrecto");
    return;
  }

  localStorage.setItem("sesion", JSON.stringify({
    usuario: nombre,
    timestamp: Date.now()
  }));

  entrarApp();
}

// ENTRAR APP (FIX)
function entrarApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
}

// LOGOUT
function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// CARGAR DATOS
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();
  render();
}

// RENDER
function render() {
  document.getElementById("dashboard").innerHTML =
    "Stock bajo: " + DATA.recambios.filter(r=>r.stock<r.min).length;

  document.getElementById("historial").innerHTML =
    DATA.movimientos.slice(-10)
      .map(m=>`${m.codigo} ${m.tipo} ${m.cantidad}`)
      .join("<br>");
}

// SCANNER
function toggleScanner() {
  if (!escaneoActivo) {
    scanner = new Html5Qrcode("reader");

    scanner.start({ facingMode:"environment" }, { fps:10 },
      (txt) => onScan(txt));

    escaneoActivo = true;

  } else {
    scanner.stop();
    escaneoActivo = false;
  }
}

// SCAN EVENT
function onScan(txt) {
  document.getElementById("codigo").value = txt;
  feedback();
  autoRegistrar(txt);
}

// FEEDBACK
function feedback() {
  new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg").play();
  if (navigator.vibrate) navigator.vibrate(100);
}

// AUTO REGISTRO
function autoRegistrar(codigoEscaneado) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  const data = {
    codigo: codigoEscaneado,
    tipo: modo,
    usuario: sesion?.usuario || "auto",
    cantidad: 1
  };

  enviar(data);
}

// ENVÍO
function enviar(data) {
  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  })
  .catch(() => guardarOffline(data));

  cargarDatos();
}

// OFFLINE
function guardarOffline(d) {
  let cola = JSON.parse(localStorage.getItem("cola")||"[]");
  cola.push(d);
  localStorage.setItem("cola", JSON.stringify(cola));
}

// SYNC
function sync() {
  let cola = JSON.parse(localStorage.getItem("cola")||"[]");

  cola.forEach(d=>{
    fetch(API_URL,{method:"POST",body:JSON.stringify(d)});
  });

  localStorage.removeItem("cola");
}

setInterval(sync, 10000);

// MODO
function setModo(t) {
  modo = t;
  alert("Modo: " + t);
}

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
