<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Almacén Pro</title>

<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; background:#111; color:white; }
input, button { padding:10px; margin:5px; }
.card { border:1px solid #444; padding:10px; margin:10px; }
button { cursor:pointer; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="login_nombre" placeholder="Usuario">
  <input id="login_pin" type="password" placeholder="PIN">
  <button id="btnLogin">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<h2>📦 Almacén</h2>

<button onclick="logout()">🚪 Salir</button>

<div id="dashboard"></div>

<button onclick="iniciarScanner()">📷 Escanear</button>
<div id="reader" style="width:300px"></div>

<input id="codigo" placeholder="Código o nombre">
<input id="cantidad" type="number" placeholder="Cantidad" value="1">

<button onclick="registrar('entrada')">Entrada</button>
<button onclick="registrar('salida')">Salida</button>
<button onclick="modoInventario()">Inventario</button>

<div id="info"></div>

<h3>📊 Histórico</h3>
<div id="historial"></div>

<h3>🔥 Top</h3>
<div id="top"></div>

<h3>🤖 Predicción</h3>
<div id="prediccion"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

let DATA = {};
let modoInv = false;
let intentosFallidos = 0;

// INIT
window.onload = async () => {
  await cargarDatos();

  document.getElementById("btnLogin").addEventListener("click", login);

  const sesion = JSON.parse(localStorage.getItem("sesion"));

  if (sesion) {
    const ahora = Date.now();
    const duracion = 8 * 60 * 60 * 1000;

    if (ahora - sesion.timestamp < duracion) {
      entrarApp();
      return;
    } else {
      localStorage.removeItem("sesion");
    }
  }
};

// LOGIN
function login() {
  const nombre = document.getElementById("login_nombre").value.trim();
  const pin = document.getElementById("login_pin").value.trim();

  const user = DATA.usuarios.find(u =>
    String(u.nombre).trim() === nombre &&
    String(u.pin).trim() === pin &&
    String(u.activo).trim().toUpperCase() === "SI"
  );

  if (!user) {
    intentosFallidos++;

    if (intentosFallidos >= 3) {
      alert("🚫 Demasiados intentos. Espera 30 segundos");
      setTimeout(() => intentosFallidos = 0, 30000);
      return;
    }

    alert("❌ Usuario o PIN incorrecto");
    return;
  }

  intentosFallidos = 0;

  const sesion = {
    usuario: nombre,
    timestamp: Date.now()
  };

  localStorage.setItem("sesion", JSON.stringify(sesion));

  entrarApp();
}

// ENTRAR / SALIR
function entrarApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function logout() {
  localStorage.removeItem("sesion");
  location.reload();
}

// CARGA DATOS
async function cargarDatos() {
  const res = await fetch(API_URL);
  DATA = await res.json();

  renderDashboard();
  renderHistorial();
  renderTop();
  renderPrediccion();
}

// SCANNER
function iniciarScanner() {
  const scanner = new Html5Qrcode("reader");

  scanner.start({ facingMode: "environment" }, { fps: 10 },
    (txt) => {
      document.getElementById("codigo").value = txt;
      scanner.stop();
      buscar(txt);
    });
}

// BUSCAR
function buscar(v) {
  const r = DATA.recambios.find(x =>
    x.activo === "SI" &&
    (x.codigo == v || x.codigo_sap == v || x.nombre.toLowerCase().includes(v.toLowerCase()))
  );

  document.getElementById("info").innerHTML =
    r ? `${r.nombre} | Stock: ${r.stock}` : "No encontrado";
}

// REGISTRAR
function registrar(tipo) {
  const sesion = JSON.parse(localStorage.getItem("sesion"));

  const data = {
    codigo: document.getElementById("codigo").value,
    tipo,
    usuario: sesion?.usuario || "desconocido",
    cantidad: document.getElementById("cantidad").value
  };

  if (modoInv) data.inventario = true;

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify(data)
  })
  .catch(() => guardarOffline(data));

  cargarDatos();
}

// OFFLINE
function guardarOffline(d) {
  let p = JSON.parse(localStorage.getItem("p")||"[]");
  p.push(d);
  localStorage.setItem("p", JSON.stringify(p));
}

// DASHBOARD
function renderDashboard() {
  document.getElementById("dashboard").innerHTML =
    `Stock bajo: ${DATA.recambios.filter(r=>r.stock<r.min).length}`;
}

// HISTORIAL
function renderHistorial() {
  document.getElementById("historial").innerHTML =
    DATA.movimientos.slice(-10).map(m =>
      `${m.codigo} ${m.tipo} ${m.cantidad}`
    ).join("<br>");
}

// TOP
function renderTop() {
  let uso = {};

  DATA.movimientos.forEach(m=>{
    if(m.tipo==="salida")
      uso[m.codigo]=(uso[m.codigo]||0)+Number(m.cantidad);
  });

  document.getElementById("top").innerHTML =
    Object.entries(uso)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,5)
      .map(t=>t.join(" → "))
      .join("<br>");
}

// PREDICCIÓN
function renderPrediccion() {
  document.getElementById("prediccion").innerHTML =
    DATA.recambios.map(r=>{
      let c = DATA.movimientos
        .filter(m=>m.codigo==r.codigo && m.tipo==="salida")
        .reduce((a,b)=>a+Number(b.cantidad),0);

      let d = c>0 ? Math.round(r.stock/(c/30)) : "∞";

      return `${r.nombre}: ${d} días`;
    }).join("<br>");
}

// INVENTARIO
function modoInventario() {
  modoInv = !modoInv;
  alert("Inventario: " + (modoInv ? "ON" : "OFF"));
}

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
