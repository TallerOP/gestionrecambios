<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";
const CACHE_TIME = 5 * 60 * 1000; // 5 minutos

async function login(e){

  if(e) e.preventDefault();

  let u = usuario.value.trim().toLowerCase();
  let p = pin.value.trim();

  if(!u || !p){
    alert("Introduce usuario y PIN");
    return;
  }

  try{

    let usuarios = await getUsuarios();

    let user = usuarios.find(x => {

      let nombre = String(x.nombre || "").trim().toLowerCase();
      let pinSheet = String(x.pin || "").trim();
      let activo = String(x.activo || "").trim().toUpperCase();

      return nombre === u && pinSheet === p && activo === "SI";
    });

    if(!user){
      alert("Usuario, PIN incorrecto o usuario inactivo");
      return;
    }

    localStorage.setItem("sesion", JSON.stringify({
      usuario: user.nombre,
      timestamp: Date.now()
    }));

    window.location.href = "index.html";

  }catch(err){
    alert("Error conexión");
    console.error(err);
  }
}

// 🔥 CACHE INTELIGENTE
async function getUsuarios(){

  let cache = JSON.parse(localStorage.getItem("usuarios_cache"));

  // Si hay cache válida → usarla
  if(cache && (Date.now() - cache.timestamp < CACHE_TIME)){
    return cache.data;
  }

  // Si no → fetch
  let res = await fetch(API_URL);
  let json = await res.json();

  let usuarios = json.usuarios || [];

  localStorage.setItem("usuarios_cache", JSON.stringify({
    data: usuarios,
    timestamp: Date.now()
  }));

  return usuarios;
}
</script>
