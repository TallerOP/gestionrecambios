<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:white;
}

/* FONDO */
body::before {
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("op.png") no-repeat center center;
  background-size:60%;
  opacity:0.3;
  z-index:-1;
}

/* HEADER */
.header {
  text-align:center;
  padding:20px;
  background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* CONTENEDOR */
.container {
  padding:20px;
}

/* FORM */
.form {
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* INPUTS */
input {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
  box-sizing:border-box;
}

/* BOTÓN */
button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:#0E3471;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

button:hover {
  opacity:0.9;
}

</style>
</head>

<body>

<div class="header">
  <img src="op.png" height="50">
  <h2>Gestión de recambios OP Mobility Pedrola</h2>
</div>

<div class="container">

<div class="form">

<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Contraseña">

<button onclick="login()">Entrar</button>

</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyURi4bcmWwsaZ4vdXUUVnr_Xu7y9BRG75tITfdwh-zgSIFpvC2lyKJLTT3XTFNS5XZA/exec";

// LOGIN (MISMA LÓGICA)
async function login(){

  let u = usuario.value.trim();
  let p = password.value.trim();

  if(!u || !p){
    alert("Introduce usuario y contraseña");
    return;
  }

  try{

    let res = await fetch(API_URL);
    let json = await res.json();

    let user = (json.usuarios || []).find(x =>
      x.usuario == u && x.password == p
    );

    if(!user){
      alert("Credenciales incorrectas");
      return;
    }

    localStorage.setItem("sesion", JSON.stringify({
      usuario: u,
      timestamp: Date.now()
    }));

    window.location.href = "index.html";

  }catch(e){
    alert("Error conexión");
    console.error(e);
  }
}
</script>

</body>
</html>
